[package]
name = "runix-capability-manager"
description = "Runix capability-based access control (L2) — signed, time-bounded capability tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Declared directly rather than via `.workspace = true` for these three:
# this crate must stay `no_std` + `alloc` (see lib.rs) so it can eventually
# be used from kernel/ (a separate, freestanding build with no `std` at
# all), which means it can't inherit std-default features from the root
# workspace's dependency table.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Not used directly — pulled in transitively by ed25519-dalek for its
# internal SHA-512 hashing. Declared here only to force `force-soft`: the
# default build hits an LLVM codegen ICE ("Do not know how to split the
# result of this operator") on x86_64-unknown-none, almost certainly a
# SIMD/vectorized-intrinsics path this freestanding target's codegen model
# doesn't handle. `force-soft` is sha2's scalar-only fallback.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lib]
name = "runix_capability_manager"
