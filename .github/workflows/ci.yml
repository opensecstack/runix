name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Dependency supply-chain policy (deny.toml at repo root) — checked
  # against every one of this repo's independent manifest roots, since
  # none of kernel/xtask/grid-sandbox-host/net-driver-host/blk-driver-host/
  # kernel-arm/net-driver-host-arm are members of the root `[workspace]`
  # (see Cargo.toml's own comment on why) and each resolves its own
  # dependency graph. See deny.toml's own doc comment for why this exists —
  # not just "keep deps fresh," but specifically to catch a compromised/
  # malicious dependency version before it lands, given citadel-integration
  # will eventually depend on opensecstack/sdk/rust on the boot-time
  # authorization path.
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - .
          - kernel
          - xtask
          - grid-sandbox-host
          - net-driver-host
          - blk-driver-host
          - kernel-arm
          - net-driver-host-arm
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}/Cargo.toml
          arguments: --config deny.toml

  # Every crate except kernel/ — see kernel/Cargo.toml's `[workspace]` stanza
  # for why it's a standalone package instead of a member here.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # net-driver-host isn't a workspace member (own [workspace], targets
      # x86_64-unknown-none — see its Cargo.toml), so `cargo test --workspace`
      # above never touches it. `--lib` only, not a bare `cargo test`: the
      # crate also has a `#![no_std] #![no_main]` bin target (main.rs) whose
      # own panic_handler conflicts with std's when cargo tries to build a
      # host test harness for it too (E0152, duplicate `panic_impl`) — `--lib`
      # runs exactly the property tests in lib.rs (is_arp_reply,
      # validate_rx_completion) and nothing else.
      - name: test net-driver-host (host-side property tests)
        working-directory: net-driver-host
        run: cargo test --lib
      # Same reasoning as net-driver-host above, for blk-driver-host's
      # FAT32 parser (BootSectorInfo::parse/parse_short_dir_entry/
      # fat_entry_at) — `--lib` only, same E0152 duplicate-`panic_impl`
      # reason `main.rs`'s bin target can't share a host test harness.
      - name: test blk-driver-host (host-side property tests)
        working-directory: blk-driver-host
        run: cargo test --lib

  # Freestanding x86_64-unknown-none build. Needs nightly from Phase 2
  # onward: exception handlers use `extern "x86-interrupt"`, which is still
  # unstable (rust-lang/rust#40180) despite being the standard way every
  # x86_64 Rust kernel defines them — see kernel/src/lib.rs's
  # `#![feature(abi_x86_interrupt)]`. `--target` is explicit rather than
  # relying on a `.cargo/config.toml` default: kernel/.cargo/config.toml
  # deliberately has none (see the comment there — an ambient default here
  # once leaked into the `kernel-tests` job's nested xtask invocation below,
  # forcing a host-side tool to try building for a bare-metal target).
  # `--bins --lib` (not `--all-targets`): the *default* libtest harness
  # still can't run on a bare target — `kernel-tests` below is what
  # actually exercises `tests/*.rs`, via its own non-libtest mechanism.
  kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            grid-sandbox-host
            net-driver-host
            blk-driver-host
      - name: fmt check
        run: cargo fmt --check
      # main.rs `include_bytes!`s grid-sandbox-host's compiled output (Phase
      # B7 — see citadel.rs's doc comment), so clippy/build here won't even
      # compile without this built first — same ordering requirement the
      # `boot` and `kernel-tests` jobs already have for the same reason.
      - name: build grid-sandbox-host (payload for Phase B7)
        working-directory: grid-sandbox-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for net-driver-host (Phase B8).
      - name: build net-driver-host (payload for Phase B8)
        working-directory: net-driver-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for blk-driver-host (Phase B9).
      - name: build blk-driver-host (payload for Phase B9)
        working-directory: blk-driver-host
        run: cargo build --target x86_64-unknown-none --release
      - name: clippy (lib + bin only)
        run: cargo clippy --target x86_64-unknown-none --bins --lib -- -D warnings
      - name: build
        run: cargo build --target x86_64-unknown-none --bins --lib

  # The real "Phase 8" harness: `cargo test` (run from kernel/, targeting
  # x86_64-unknown-none) builds each `kernel/tests/*.rs` as its own bootable
  # binary (`harness = false` in Cargo.toml — no libtest, since there's no
  # `test`/panic-unwind runtime on bare metal), boots it for real in QEMU
  # via kernel/.cargo/config.toml's `runner` (which delegates to xtask's
  # `test-runner` subcommand), and reads pass/fail from the isa-debug-exit
  # device (kernel/src/qemu_exit.rs) — a real exit code, not string-matched
  # serial output. This is what catches architecture-specific bugs (like the
  # GDT/segment-register one in the README) that `cargo test --workspace` on
  # the host never could.
  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          # `rust-src`: the `bootloader` crate's build script (invoked via
          # `xtask` in this job) compiles its own boot-sector/stage-2/3/4
          # helper binaries for bare-metal targets, which needs to build
          # core/alloc from source — without this component that fails with
          # "does not exist, unable to build with the standard library".
          components: llvm-tools, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            xtask
            grid-sandbox-host
            net-driver-host
            blk-driver-host
      - name: install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      # `dosfstools` (mkfs.fat) and `mtools` (mcopy) aren't part of
      # `ubuntu-latest`'s preinstalled image (unlike `nc`/`python3` for
      # net_driver_tcp below) -- confirmed rather than assumed, same
      # "confirm rather than assume" discipline that check got. Needed by
      # `tests/support/make_fat32_image.sh` to build a real FAT32 fixture
      # for `blk_fat32_read` below.
      - name: install dosfstools and mtools (FAT32 fixture image tooling)
        run: sudo apt-get update && sudo apt-get install -y dosfstools mtools
      # `grid_sandbox_wasm` below needs this binary already built on disk
      # (`include_bytes!` embeds it at kernel-test compile time) — see
      # `kernel/tests/grid_sandbox_wasm.rs`'s own doc comment. Built here,
      # not as part of the `kernel-tests` `cargo test` invocation, since
      # it's a separate standalone package (own `[workspace]`, same
      # reasoning as `kernel`/`xtask` — see its `Cargo.toml`).
      - name: build grid-sandbox-host (payload for grid_sandbox_wasm)
        working-directory: grid-sandbox-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for `net_driver_icmp`/`net_driver_tcp` below.
      - name: build net-driver-host (payload for net_driver_icmp/net_driver_tcp)
        working-directory: net-driver-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for `blk_driver_rw` below.
      - name: build blk-driver-host (payload for blk_driver_rw)
        working-directory: blk-driver-host
        run: cargo build --target x86_64-unknown-none --release
      # Real, compiled desktop-side MARSHAL/CITADEL proxy -- payload for
      # marshal_proxy_e2e below. `runix-desktop` targets the host triple
      # (this job's default), not x86_64-unknown-none, unlike every other
      # "build ... (payload for ...)" step above -- it's a real `std`
      # binary that runs on the host, not something embedded into a kernel
      # test's own boot image via `include_bytes!`.
      - name: build citadel_proxy (payload for marshal_proxy_e2e)
        run: cargo build -p runix-desktop --bin citadel_proxy --release
      # Filesystem driver, Phase 2's fixture -- a real FAT32 image built by
      # real tooling (mkfs.fat/mtools), not a hand-rolled byte fixture. See
      # tests/support/make_fat32_image.sh's own doc comment.
      - name: build FAT32 test fixture image
        working-directory: kernel
        run: bash tests/support/make_fat32_image.sh target/runix-fat32-test.img
      - name: cargo test (boots every kernel/tests/*.rs in QEMU)
        working-directory: kernel
        # `--test basic_boot`, not a bare `cargo test`: with no target
        # selection, cargo also tries to build the lib's own unit-test
        # harness (`--lib`), which needs `test`/panic-unwind — unavailable
        # on a bare-metal target regardless of `harness = false` on the
        # integration tests. Add `--test <name>` for each new file under
        # tests/ as they're added; there's no single flag that means "every
        # tests/*.rs but not lib/bin unit tests" (`--tests`, despite the
        # name, still pulls in `--lib`/`--bins` too).
        run: |
          cargo test --target x86_64-unknown-none --test basic_boot
          cargo test --target x86_64-unknown-none --test guard_page
          cargo test --target x86_64-unknown-none --test thread_reclaim
          cargo test --target x86_64-unknown-none --test watchdog
          cargo test --target x86_64-unknown-none --test pci_scan
          cargo test --target x86_64-unknown-none --test process_isolation
          cargo test --target x86_64-unknown-none --test elf_loader
          cargo test --target x86_64-unknown-none --test scheduler_address_space
          cargo test --target x86_64-unknown-none --test ring3_cooperative
          cargo test --target x86_64-unknown-none --test grid_sandbox_wasm
          cargo test --target x86_64-unknown-none --test grid_sandbox_tier_t1
          cargo test --target x86_64-unknown-none --test grid_sandbox_tier_t3
          cargo test --target x86_64-unknown-none --test grid_sandbox_multi_instance
          cargo test --target x86_64-unknown-none --test citadel_demo
          cargo test --target x86_64-unknown-none --test net_driver_icmp
          cargo test --target x86_64-unknown-none --test net_driver_dhcp
          cargo test --target x86_64-unknown-none --test blk_driver_rw
      # Filesystem driver, Phase 2 -- points xtask's virtio-blk `-drive` at
      # the real FAT32 fixture built above instead of the plain zero-filled
      # scratch image every test above gets by default. `RUNIX_BLK_IMG` is
      # `xtask/src/main.rs::run_qemu`'s own override point for its
      # otherwise-hardcoded blk backing file -- same override-point shape
      # `RUNIX_NETDEV_ARG` already is for `-netdev`, used just below.
      - name: cargo test blk_fat32_read (real FAT32 image via virtio-blk)
        working-directory: kernel
        run: |
          RUNIX_BLK_IMG="$(pwd)/target/runix-fat32-test.img" \
            cargo test --target x86_64-unknown-none --test blk_fat32_read
      # Filesystem driver, Phase 5's own write proof runs as part of the
      # test above (folded into the same `attempt_fat32` boot mode, same
      # judgment call Phase 3/4 made for subdirectories/multi-cluster/long
      # filenames) -- this step is an *independent* confirmation the write
      # actually landed on the real disk image, not just trusting
      # blk-driver-host's own self-report (the same "don't just trust the
      # thing under test to grade itself" instinct that made this fixture
      # real `mkfs.fat` output in the first place). `mtype`'s output must
      # be the `write_pattern_byte` pattern (`b'Z' - (i % 26)`), not the
      # fixture's original `b'A' + (i % 26)` content.
      - name: verify WRITE.TXT was actually overwritten on disk
        working-directory: kernel
        run: |
          actual="$(mtype -i target/runix-fat32-test.img ::WRITE.TXT | head -c 5)"
          if [ "$actual" != "ZYXWV" ]; then
            echo "expected WRITE.TXT to start with ZYXWV after blk_fat32_read's write proof, got: $actual" >&2
            exit 1
          fi
      # Filesystem driver, Phase 6's own independent confirmation --
      # checks both the *size* (via `mdir`, not just content) and the
      # exact new content, the same "don't just trust the thing under
      # test to grade itself" instinct as the WRITE.TXT check above.
      - name: verify PARTIAL.TXT was actually resized and overwritten on disk
        working-directory: kernel
        run: |
          size="$(mdir -i target/runix-fat32-test.img ::PARTIAL.TXT | grep PARTIAL | tr -s ' ' | cut -d' ' -f3)"
          if [ "$size" != "300" ]; then
            echo "expected PARTIAL.TXT to be 300 bytes after blk_fat32_read's partial-write proof, got: $size" >&2
            exit 1
          fi
          actual="$(mtype -i target/runix-fat32-test.img ::PARTIAL.TXT | head -c 5)"
          if [ "$actual" != "01234" ]; then
            echo "expected PARTIAL.TXT to start with 01234, got: $actual" >&2
            exit 1
          fi
      # Filesystem driver, Phase 7's own independent confirmation -- same
      # "don't just trust the thing under test to grade itself" instinct as
      # the WRITE.TXT/PARTIAL.TXT checks above, now covering allocation
      # (GROW.TXT's new size and appended content), delete (DELETE_M.TXT
      # must no longer appear in the listing at all), and create
      # (CREATED.TXT exists with the exact content a driver-created file
      # should have, in a slot that didn't exist in the fixture until this
      # boot ran).
      - name: verify GROW.TXT/DELETE_M.TXT/CREATED.TXT reflect Phase 7's writes on disk
        working-directory: kernel
        run: |
          grow_size="$(mdir -i target/runix-fat32-test.img :: | awk '$1 == "GROW" && $2 == "TXT" { print $3 }')"
          if [ "$grow_size" != "712" ]; then
            echo "expected GROW.TXT to be 712 bytes after blk_fat32_read's chain-growth proof, got: $grow_size" >&2
            exit 1
          fi
          grow_tail="$(mtype -i target/runix-fat32-test.img ::GROW.TXT | tail -c 10)"
          if [ "$grow_tail" != "0123456789" ]; then
            echo "expected GROW.TXT's appended tail to be the 0-9 digit cycle, got: $grow_tail" >&2
            exit 1
          fi
          if mdir -i target/runix-fat32-test.img :: | grep -q DELETE_M; then
            echo "expected DELETE_M.TXT to no longer appear in the root directory after blk_fat32_read's delete proof" >&2
            exit 1
          fi
          created_actual="$(mtype -i target/runix-fat32-test.img ::CREATED.TXT | head -c 5)"
          if [ "$created_actual" != "ABCDE" ]; then
            echo "expected CREATED.TXT to start with ABCDE, got: $created_actual" >&2
            exit 1
          fi
      # Filesystem driver, Phase 3 -- the real IPC/capability-scoping proof
      # (see docs/STATUS.md's filesystem-driver narrative): a second
      # process asks blk-driver-host for a file over capability-gated
      # SYS_IPC_SEND/SYS_IPC_RECV. Same FAT32 fixture as blk_fat32_read.
      - name: cargo test blk_fs_ipc (filesystem IPC surface via virtio-blk)
        working-directory: kernel
        run: |
          RUNIX_BLK_IMG="$(pwd)/target/runix-fat32-test.img" \
            cargo test --target x86_64-unknown-none --test blk_fs_ipc
      # Filesystem driver, Phase 8's own independent confirmation -- same
      # "don't just trust the thing under test to grade itself" instinct
      # as every write-adjacent phase since 5, now for a write that
      # traveled over capability-gated IPC instead of being driven
      # directly by blk-driver-host's own internal proof code.
      # `ipc_write_pattern_byte` (`b'z' - (i % 26)`) is deliberately
      # distinct from Phase 5's own direct-write pattern (`b'Z' - ...`,
      # uppercase) -- this step runs after blk_fs_ipc, which itself runs
      # after blk_fat32_read's own WRITE.TXT check above, so this is
      # confirming the *second*, IPC-driven overwrite landed on top of
      # the first.
      - name: verify WRITE.TXT reflects the IPC-driven write on disk
        working-directory: kernel
        run: |
          actual="$(mtype -i target/runix-fat32-test.img ::WRITE.TXT | head -c 5)"
          if [ "$actual" != "zyxwv" ]; then
            echo "expected WRITE.TXT to start with zyxwv after blk_fs_ipc's IPC write proof, got: $actual" >&2
            exit 1
          fi
      # Filesystem driver: concurrency/locking -- two client threads
      # sending to the same FS_REQUEST_PORT with no yield between their
      # spawns, proving the new SYS_IPC_SEND_LOCK/SYS_IPC_SEND_UNLOCK pair
      # (kernel/src/ipc.rs's begin_send/end_send) actually serializes them
      # instead of letting their byte streams interleave. Read-only, so no
      # follow-up disk-state check is needed the way the write-path steps
      # above have.
      - name: cargo test blk_fs_concurrent (concurrent same-port requests via virtio-blk)
        working-directory: kernel
        run: |
          RUNIX_BLK_IMG="$(pwd)/target/runix-fat32-test.img" \
            cargo test --target x86_64-unknown-none --test blk_fs_concurrent
      # Phase 2b's real TCP client proof -- SLIRP has no built-in TCP
      # listener to connect to (confirmed during design research), so this
      # starts a real listener on the host first (kernel/tests/support/
      # tcp_proof_listener.py) and points QEMU's `-netdev` at it via a
      # `guestfwd` route (net-driver-host connects to 10.0.2.100:9000,
      # which QEMU bridges to `nc 127.0.0.1 9001`, i.e. the listener).
      # `RUNIX_NETDEV_ARG` is `xtask/src/main.rs::run_qemu`'s own override
      # point for its otherwise-hardcoded `-netdev` value -- every other
      # test above leaves it unset and gets today's plain default
      # unchanged. `nc` (netcat-openbsd) is preinstalled on `ubuntu-latest`;
      # `python3` needs no install step either.
      - name: cargo test net_driver_tcp (real TCP client via guestfwd)
        working-directory: kernel
        run: |
          python3 tests/support/tcp_proof_listener.py &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001" \
            cargo test --target x86_64-unknown-none --test net_driver_tcp
      # Sockets IPC surface -- same `guestfwd`/listener setup as
      # net_driver_tcp above (a fresh listener process, since the previous
      # one already exited after serving that test's one connection), now
      # driven entirely through the capability-gated sockets IPC ports
      # (`net_driver_sockets.rs`) instead of `net-driver-host`'s own
      # hardcoded Phase 2b proof.
      - name: cargo test net_driver_sockets (sockets IPC surface via guestfwd)
        working-directory: kernel
        run: |
          python3 tests/support/tcp_proof_listener.py &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001" \
            cargo test --target x86_64-unknown-none --test net_driver_sockets
      # Concurrent sockets -- two independently-opened handles through the
      # same sockets IPC surface, proven with a *single* `guestfwd` route
      # reused for two overlapping connections rather than two routes (see
      # `kernel/tests/support/two_socket_proof_listener.py`'s own doc
      # comment for why: QEMU spawns a fresh bridge per new
      # guest-initiated connection to a `guestfwd` target regardless of how
      # many to it are already open, so one route is enough).
      - name: cargo test net_driver_sockets_concurrent (two concurrent socket handles)
        working-directory: kernel
        run: |
          python3 tests/support/two_socket_proof_listener.py &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9002" \
            cargo test --target x86_64-unknown-none --test net_driver_sockets_concurrent
      # MARSHAL evaluation surface's socket-based transport
      # (kernel::marshal_client) -- same `guestfwd`/listener setup as
      # net_driver_tcp/net_driver_sockets above, bridged to
      # marshal_proof_listener.py's port 9003 instead. That listener is not
      # a MARSHAL proxy or any stand-in for one (see its own doc comment) --
      # it only proves the MarshalRequest/MarshalResponse wire format
      # survives a real TCP round trip through the sockets IPC surface.
      - name: cargo test marshal_tcp_roundtrip (MARSHAL client over sockets IPC via guestfwd)
        working-directory: kernel
        run: |
          python3 tests/support/marshal_proof_listener.py &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9003" \
            cargo test --target x86_64-unknown-none --test marshal_tcp_roundtrip
      # Full MARSHAL/CITADEL chain, one hop further than
      # marshal_tcp_roundtrip above: instead of a Python stand-in
      # (marshal_proof_listener.py) answering the wire format directly, the
      # `guestfwd` bridge now points at the REAL, just-built `citadel_proxy`
      # binary, which itself makes a REAL HTTP call (HttpKerkeseTransport)
      # to a mock CITADEL HTTP endpoint (mock_citadel_server.py). Ports:
      # 9105 (mock CITADEL HTTP endpoint) -> 9104 (citadel_proxy's own TCP
      # listen address, bridged by `nc`) -> guest's 10.0.2.100:9000 -- three
      # distinct host ports, none reused from net_driver_tcp/net_driver_sockets/
      # marshal_tcp_roundtrip above.
      - name: cargo test marshal_proxy_e2e (real citadel_proxy + mock CITADEL via guestfwd)
        working-directory: kernel
        run: |
          python3 tests/support/mock_citadel_server.py &
          sleep 0.3
          CITADEL_PROXY_LISTEN_ADDR=127.0.0.1:9104 \
            RUNIX_CITADEL_URL=http://127.0.0.1:9105/marshal/kerkese \
            ../target/release/citadel_proxy &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9104" \
            cargo test --target x86_64-unknown-none --test marshal_proxy_e2e
      # grid_sandbox::spawn_instance's shadow-mode (observe-only, never
      # gates a real spawn) MARSHAL evaluation -- see that function's own
      # doc comment for why shadow mode, not real enforcement. Two cases in
      # one boot: unconfigured (no networking attempted, records
      # Unreachable) and configured against a real listener answering
      # REFUSE (grid_sandbox_marshal_shadow_listener.py, port 9004 -- a
      # permissive sibling of marshal_proof_listener.py, not a MARSHAL
      # proxy or stand-in for one, see its own doc comment). Both cases
      # assert spawn_instance still returns Ok regardless of the shadow
      # outcome.
      - name: cargo test grid_sandbox_marshal_shadow (shadow-mode MARSHAL evaluation, observe-only)
        working-directory: kernel
        run: |
          python3 tests/support/grid_sandbox_marshal_shadow_listener.py &
          sleep 0.3
          RUNIX_NETDEV_ARG="user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9004" \
            cargo test --target x86_64-unknown-none --test grid_sandbox_marshal_shadow

  # Mobile L1 (aarch64/TrustZone), separate from the x86_64 `kernel` job
  # above — different target triple, different toolchain requirement (this
  # one builds on stable). Alpha scope so far: EL3 boot, a real exception
  # vector table (catches and resumes a deliberate fault with full context
  # preserved), a fully proven GIC bring-up (SGI delivered through the IRQ
  # vector, acknowledged and EOI'd), the EL3->EL1 Non-secure drop (the
  # actual TrustZone boundary), EL1's own MMU (identity-mapped, verified
  # with AT S1E1R actually translating, not just enabling without
  # crashing), and the RIL isolation boundary itself (EL1->EL0 drop, SVC
  # syscall gate, capability-token-gated resource check reusing
  # capability-manager) — see kernel-arm/src/main.rs's doc comment for
  # full status and the "why a separate crate from kernel/" decision.
  kernel-arm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-none
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel-arm
            net-driver-host-arm
      - name: fmt check
        run: cargo fmt --check
      # tcp_proof.rs's `include_bytes!` embeds this binary at kernel-arm
      # compile time (Beta mobile item 2.5, "Stage 3: real outbound TCP at
      # EL0") — same "build the payload before the thing that embeds it"
      # requirement/reasoning as net-driver-host's own CI step on the
      # x86_64 side, just a different standalone crate/target. Built from
      # the sibling directory, not `kernel-arm` (this job's default
      # `working-directory`), and **before** `clippy`/`build` below since
      # both of those compile `kernel-arm` itself, which needs this binary
      # to already exist on disk.
      - name: build net-driver-host-arm (payload for tcp_proof.rs's net TCP proof)
        working-directory: net-driver-host-arm
        run: cargo build --target aarch64-unknown-none --release
      - name: clippy
        run: cargo clippy --target aarch64-unknown-none -- -D warnings
      - name: build
        run: cargo build --target aarch64-unknown-none --release
      - name: install QEMU (aarch64)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: boot in QEMU and check EL3 boot, exception resume, GIC, EL3->EL1 drop
        # The `guestfwd` route + listener are for tcp_proof.rs's net TCP
        # proof (Beta mobile item 2.5, "Stage 3") below — identical
        # `tcp_proof_listener.py`/port/guestfwd-target convention
        # `kernel-tests`' own `net_driver_tcp` step uses on the x86_64 side
        # (reused verbatim, per docs/BETA_MOBILE_PROGRESS.md item 2.5), safe
        # to reuse port 9001 unmodified since this is a separate CI job/
        # runner from that one. `nc`/`python3` are preinstalled on
        # `ubuntu-latest`, same as that step's own comment notes.
        #
        # `timeout` is 25 s, set from MEASUREMENT (9 CI runs, per-line runner
        # timestamps): this step's last required serial line appears within
        # ~1-6 s of the first serial line (worst case ~7 s once Beta item 4's
        # data reset adds an eighth MARSHAL evaluation), so 25 s is ~3.6x the
        # worst case. The guest idles forever after its demo, so `timeout` always
        # kills QEMU and a step's wall-clock is ~N regardless of the boot; only
        # time-to-last-required-line matters. Runner speed varied ~2.4x between
        # identical runs, so do not tighten further without more data.
        run: |
          python3 ../kernel/tests/support/tcp_proof_listener.py &
          sleep 0.3
          timeout 25 qemu-system-aarch64 \
            -M virt,secure=on,gic-version=2 -cpu cortex-a53 -nographic \
            -kernel target/aarch64-unknown-none/release/runix-kernel-arm \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001" \
            -device virtio-net-device,netdev=net0 \
            -global virtio-mmio.force-legacy=false \
            | tee /tmp/arm-boot.log || true
          grep -q "Runix ARM kernel: boot OK" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: CurrentEL = EL3" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: VBAR_EL3 installed" /tmp/arm-boot.log
          # Proves the exception vector table actually catches a fault and
          # resumes with the interrupted register context intact, not just
          # that installing VBAR_EL3 didn't crash on its own.
          grep -q "EXCEPTION: vector 4 (Synchronous (current EL, SPx))" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: EXCEPTION test OK (resumed after brk)" /tmp/arm-boot.log
          # Proves a Software Generated Interrupt is actually delivered
          # through the GIC into the IRQ vector, not just pending at the
          # distributor (see gic.rs's doc comment for what that distinction
          # cost to find).
          grep -q "EXCEPTION: IRQ fired, GIC interrupt id = 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: GIC test OK" /tmp/arm-boot.log
          # The actual TrustZone boundary.
          grep -q "Runix ARM kernel: reached EL1 (dropped from EL3, SCR_EL3.NS=1)" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: CurrentEL = EL1" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: VBAR_EL1 installed" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MMU enabled" /tmp/arm-boot.log
          # Proves the MMU is actually translating, not just that
          # SCTLR_EL1.M's write didn't crash: AT S1E1R asks the hardware
          # itself to translate UART0's VA and report the result.
          grep -q "fault=false, PA=0x9000000" /tmp/arm-boot.log
          # virtio-mmio device discovery (Stage 0 of kernel-arm networking,
          # docs/BETA_MOBILE_PROGRESS.md item 2.1): the `-netdev`/`-device
          # virtio-net-device` pair above is what makes one of the `virt`
          # machine's 32 MMIO slots non-empty at all. Deliberately asserts
          # no particular slot index: QEMU assigns these slots top-down
          # (locally the device lands at slot 31, not 0). The MAC is the
          # real check that config space at slot_base+0x100 was read
          # correctly -- 52:54:00:12:34:56 is QEMU's own default guest MAC,
          # so a wrong offset or stride cannot produce it by accident.
          grep -q "Runix ARM kernel: virtio-mmio net device at slot " /tmp/arm-boot.log
          grep -q "MAC 52:54:00:12:34:56" /tmp/arm-boot.log
          # virtqueue bring-up + one hand-built ARP round trip (Stage 1,
          # item 2.2). `-global virtio-mmio.force-legacy=false` above is
          # load-bearing, not cosmetic: virtio_net.rs requires MMIO
          # transport version 2 (separate per-queue ring-address registers)
          # and refuses to run on legacy, so without that flag this prints
          # its failure line instead. 10.0.2.2 is SLIRP's gateway and
          # 52:55:0a:00:02:02 is the MAC SLIRP answers with (its
          # `52:55:` + the four address bytes convention) -- asserting the
          # *specific* MAC, not just "some reply", is what makes this proof
          # that a real frame crossed the virtqueue rather than that this
          # driver echoed back something it made up itself.
          grep -q "Runix ARM kernel: virtio-net ARP reply from 10.0.2.2, sender MAC 52:55:0a:00:02:02" \
            /tmp/arm-boot.log
          # The RIL isolation boundary: EL1->EL0 drop, SVC gate, and a real
          # capability-manager token check distinguishing an authorized
          # channel from an unauthorized one — not just that EL0 code ran.
          grep -q "Runix ARM kernel: heap initialized" /tmp/arm-boot.log
          # Per-process address-space separation (kernel-arm/src/process.rs,
          # Stage 5 slice 2 of docs/BETA_MOBILE_PROGRESS.md item 2.4): two
          # independent TTBR0_EL1-rooted table sets map the SAME VA
          # (0x80123000) to different private pages. A=0xaa/B=0xbb is read
          # back through that one VA after a real TTBR0_EL1 write, and the
          # bracketed AT S1E1R pair is the MMU hardware's own report of two
          # different physical addresses for it — if the two spaces had
          # accidentally shared translation tables, the second map would
          # have overwritten the first and both reads would say 0xbb.
          grep -q "Runix ARM kernel: address-space isolation VA 0x80123000 A=0xaa B=0xbb" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: address-space isolation PASS" /tmp/arm-boot.log
          # The ELF loader (kernel-arm/src/loader.rs + load_proof.rs, Stage 5
          # slice 3 of docs/BETA_MOBILE_PROGRESS.md item 2.4): a hand-
          # assembled two-segment AArch64 image loaded into a real address
          # space. Three independent properties, the same three
          # kernel/tests/elf_loader.rs proves on x86_64:
          #   (a) content — the text bytes (1f2003d5, a real `nop`) and the
          #       data string are read back through the *loaded VAs* after a
          #       genuine TTBR0_EL1 switch, not out of kernel bookkeeping,
          #       and bss_nonzero_bytes=0 is the BSS tail actually zeroed
          #       rather than left holding a recycled frame's contents;
          #   (b) W^X in the real descriptors — text AP=0b11 (not writable)
          #       with UXN=0 (fetchable at EL0), data AP=0b01 with UXN=1, and
          #       PXN=1 on everything (a process page is never EL1 code);
          #   (c) W^X as the *hardware* reports it — AT S1E0R/S1E0W asking
          #       the MMU whether EL0 may read/write each page, where
          #       "text read=ok write=fault" is the W half of W^X enforced
          #       by translation rather than inferred from our own bits.
          grep -q "Runix ARM kernel: ELF load content text=1f2003d5 data=runix bss_nonzero_bytes=0" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: ELF load W^X text AP=0b11 UXN=0 PXN=1, data AP=0b01 UXN=1 PXN=1, stack AP=0b01 UXN=1 PXN=1" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: ELF load EL0 access (AT S1E0R/S1E0W) text read=ok write=fault, data read=ok write=ok" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: ELF loader PASS" /tmp/arm-boot.log
          # The cooperative scheduler (kernel-arm/src/scheduler.rs, Stage 5
          # slice 5 of item 2.4): three EL1 kernel threads each print three
          # tagged rounds with a yield_now() between them. The interleaving
          # line is the real assertion -- a scheduler that spawned three
          # threads but never actually switched registers/stacks would print
          # A0,A1,A2,B0,... (each thread run to completion) and fail here,
          # while still "booting fine". DAIF=0x3c0 is the masked
          # Debug/SError/IRQ/FIQ state the switch relies on (see that
          # module's doc comment): asserted, not assumed, since it is read
          # out of the live register at proof time.
          grep -q "Runix ARM kernel: scheduler init (cooperative, DAIF=0x3c0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: scheduler thread A0 running" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: scheduler thread C2 running" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: scheduler interleaving A0,B0,C0,A1,B1,C1,A2,B2,C2" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: scheduler PASS" /tmp/arm-boot.log
          # The first real EL0 process (kernel-arm/src/el0_proof.rs — the
          # "combining slices 3-5" step of item 2.4): a scheduled thread that
          # owns a process::AddressSpace, is resumed with its own TTBR0_EL1,
          # and eret's into an image loader.rs actually loaded. Every line
          # below is hardware state, not this code's bookkeeping, which is
          # what makes it a proof rather than a log:
          #   - SPSR_EL1=0x3c0 with M=0x0 is the CPU's own record that the
          #     SVC came from EL0t. An "eret" that never left EL1 would
          #     report M=0x5 (EL1h) and fail here.
          #   - ELR_EL1 inside 0x80400000..0x80401000 puts the interrupted
          #     instruction in *process-private* memory that only this
          #     address space maps — not in the kernel image.
          #   - the three TTBR0_EL1 values agreeing on the space's root, plus
          #     "AT S1E0R data=ok", are the MMU's answer for a VA that is
          #     unmapped in the kernel's identity table: a TTBR0_EL1 the
          #     scheduler failed to switch instruction-aborts at EL0 instead
          #     (verified by deliberately disabling the switch: EC=0x20 at
          #     0x80400000, reported as FAILED rather than hanging).
          #   - magic=0x7e is the byte loader.rs copied in, witness=0x5a one
          #     the payload *wrote and read back* through its own AP=0b01
          #     page, stack=0x42 one pushed/popped on its own EL0 stack —
          #     real loads and stores, not just instruction fetch.
          grep -q "Runix ARM kernel: EL0 process observed SPSR_EL1=0x3c0 (M=0x0, EL0t=true)" \
            /tmp/arm-boot.log
          grep -q "inside loaded text 0x80400000..0x80401000: true" /tmp/arm-boot.log
          grep -q "AT S1E0R data=ok" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: EL0 process payload magic=0x7e witness=0x5a stack=0x42" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: EL0 process PASS" /tmp/arm-boot.log
          # ...and the other half of "TTBR0_EL1 follows the schedule": the
          # boot thread, which owns no address space, is resumed with the
          # *kernel's* table reinstalled rather than inheriting the
          # process's. `elided=` being much larger than `writes=` is the
          # skip-if-already-loaded optimization demonstrated rather than
          # asserted — prove_scheduling's kernel-to-kernel switches all
          # elide. `writes=2` (into the space, then back to the kernel) is
          # the stable count; the kernel table's own address is deliberately
          # NOT asserted, since it depends on where the linker put
          # mmu.rs's LEVEL1_TABLE and would break on an unrelated codegen
          # change.
          grep -q "Runix ARM kernel: EL0 process boot thread resumed, TTBR0_EL1=0x.* (kernel table), TTBR0_EL1 writes=2 elided=" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: RIL capability issued" /tmp/arm-boot.log
          # "U" (SYS_WRITE gate proof) immediately followed by "B" (0x42,
          # a real EL0 stack strb/ldrb round-trip) on the same line, since
          # neither syscall emits a newline -- proves real EL0/EL1 page-
          # granular memory isolation actually grants data access on
          # el0_demo's own page, not just that instruction fetch works.
          grep -q "^UB$" /tmp/arm-boot.log
          grep -q "SVC: SYS_RIL_ACCESS channel 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_RIL_ACCESS channel 99 DENIED" /tmp/arm-boot.log
          # The check gates real per-operation I/O, not just a one-time
          # access decision: a byte sent on the authorized channel round
          # -trips back out (0x41, echoed as 'A'), the same operation on
          # the unauthorized channel is denied outright.
          grep -q "SVC: SYS_RIL_SEND channel 0 byte 0x41 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_RIL_RECV channel 0 authorized, byte 0x41" /tmp/arm-boot.log
          grep -q "^A$" /tmp/arm-boot.log
          grep -q "SVC: SYS_RIL_SEND channel 99 DENIED" /tmp/arm-boot.log
          grep -q "SVC: SYS_RIL_RECV channel 99 DENIED" /tmp/arm-boot.log
          # eSIM profile lifecycle: the same capability check gating a real
          # state machine (sim.rs) instead of RIL's byte mailbox -- a full
          # Created -> Disabled -> Enabled -> Disabled -> Deleted walk on an
          # authorized slot's first profile, denied outright on an
          # unauthorized slot. Three capabilities are issued for this, not
          # one (slot-level, per-profile, and delete-specific) -- see
          # kernel-arm/src/svc.rs's doc comment on why delete is scoped
          # separately from general profile access.
          grep -q "Runix ARM kernel: eSIM profile capability issued" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: eSIM delete capability issued" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_CREATE slot 0 authorized, profile 0" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_STATUS slot 0 profile 0 authorized, state Created" /tmp/arm-boot.log
          # The only syscall in the demo that uses the third SVC argument
          # (identity, in EL0's x3) -- a wrong stack offset in
          # el1_vectors.rs's `ldr x4` would surface here as a garbage
          # identity, which a clean compile cannot catch.
          grep -q "SVC: SYS_SIM_INSTALL slot 0 profile 0 identity 0x1234 authorized" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_STATUS slot 0 profile 0 authorized, state Disabled" \
            /tmp/arm-boot.log
          # Enable succeeding is itself an assertion: esim_marshal.rs's
          # fail-open gate must not block a legitimate authorized operation.
          # Beta item 2.6: this is no longer a stub returning Unreachable
          # without trying -- marshal_transport::evaluate now really attempts
          # a connection to the configured (but, in this boot config,
          # unmapped) 10.0.2.100:9100 and only *then* falls back to
          # Unreachable, which is what the first grep line below confirms
          # actually happened rather than assuming it.
          grep -q "Runix ARM kernel: MARSHAL evaluation for enable slot=0 profile=0: Unreachable" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_STATUS slot 0 profile 0 authorized, state Enabled" /tmp/arm-boot.log
          # Deleting an Enabled profile must be rejected at the syscall
          # boundary, not silently turned into disable-then-delete -- the
          # one "expected failure" in this walk (see sim.rs's doc comment).
          # Install over an Enabled profile must be rejected: before the per-operation
          # source-state fix, sim.rs let `install` act on an Enabled profile, silently
          # demoting it and overwriting its identity.
          grep -q "SVC: SYS_SIM_INSTALL slot 0 profile 0 FAILED (wrong state for this operation (Enabled))" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_DELETE slot 0 profile 0 FAILED (wrong state for this operation (Enabled))" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_DISABLE slot 0 profile 0 authorized" /tmp/arm-boot.log
          # The identical delete that failed above now succeeds, from Disabled.
          grep -q "SVC: SYS_SIM_DELETE slot 0 profile 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_STATUS slot 0 profile 0 authorized, state Deleted" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_CREATE slot 99 DENIED" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_STATUS slot 99 profile 0 DENIED" /tmp/arm-boot.log
          # General-purpose IPC channels (kernel-arm/src/ipc_channel.rs), the
          # ARM analogue of kernel/src/ipc.rs's fixed-count byte channels --
          # a separately-addressed channel space with its own `ipc:{channel}`
          # capability strings, so the RIL grant above does not reach it. A
          # byte sent on the authorized channel round-trips back out (0x49,
          # echoed as 'I'); the same pair on an unauthorized channel number
          # is denied before ipc_channel::send/recv ever runs.
          grep -q "Runix ARM kernel: IPC capability issued (channel 0" /tmp/arm-boot.log
          grep -q "SVC: SYS_IPC_SEND channel 0 byte 0x49 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_IPC_RECV channel 0 authorized, byte 0x49" /tmp/arm-boot.log
          grep -q "^I$" /tmp/arm-boot.log
          grep -q "SVC: SYS_IPC_SEND channel 99 DENIED" /tmp/arm-boot.log
          grep -q "SVC: SYS_IPC_RECV channel 99 DENIED" /tmp/arm-boot.log
          # MVNO account layer (Beta item 3.3: kernel-arm/src/mvno.rs wrapping
          # runix-mobile). Account 0 is compiled-in demo data; the walk binds
          # profile 0 before the first enable, then suspends the account while
          # the profile is Enabled (forced disable + clean audit), shows enable
          # DENIED under the Suspended account, reactivates, and re-enables.
          # An installed-but-never-bound profile is DENIED too (fail closed), and
          # account 99 (no capability) is DENIED. The MVNO syscalls are
          # capability-gated, then MARSHAL-gated (Beta item 3.4), then audited;
          # with no proxy route in this boot config the gate reads Unreachable
          # (fail-open), see the MARSHAL evaluation greps below.
          grep -q "Runix ARM kernel: MVNO account capability issued (account 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MVNO suspend capability issued (account 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MVNO demo account opened (account 0" /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 authorized (1 Enabled profile(s) to force-disable)" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 forced disable slot 0 profile 0 ok" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 audit clean" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 0 DENIED (MVNO AccountNotActive(Suspended))" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_REACTIVATE account 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_DELETE slot 0 profile 0 unbound from account 0" /tmp/arm-boot.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 1 DENIED (MVNO NotBound)" /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_BIND account 99 slot 0 profile 1 DENIED" /tmp/arm-boot.log
          # Account capability held, profile capability (sim:0:2) NOT: BIND
          # needs both, and the DENIED line names the failing resource.
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 2 DENIED (resource sim:0:2" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 99 DENIED" /tmp/arm-boot.log
          # Beta item 3.4: the three MVNO syscalls are evaluated by MARSHAL
          # (generalized esim gate, kernel-arm/src/marshal_action.rs) between
          # their capability check and the registry mutation. This boot config
          # has no guestfwd route for 10.0.2.100:9100, so each evaluation
          # attempts the connection and falls back to Unreachable (fail-open,
          # the syscall still proceeds -- the "authorized" greps above). The
          # denied BIND/SUSPEND calls (accounts 99, profile 2) fail the
          # capability check first and are never evaluated.
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.bind_profile account=0 slot=0 profile=0: Unreachable" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.suspend_account account=0: Unreachable" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.reactivate_account account=0: Unreachable" \
            /tmp/arm-boot.log
          # Data policy layer (Beta item 4.3: kernel-arm/src/data.rs +
          # data_state.rs/data_codes.rs wrapping runix_mobile::policy and
          # ::reconcile). The engine only REQUESTS and the reconciler only
          # OBSERVES; the requests are carried out by the caller through the
          # existing governed syscalls, so none of the four of them is MARSHAL-gated
          # (asserted below: the only data action ever evaluated is the reset).
          # Account 0 is compiled-in DEMO data: cap 1000 bytes, throttle at
          # 80%, no roaming, suspension requested at 150%. The walk runs it
          # between the first ENABLE and the existing SUSPEND(0), which is the
          # caller carrying out the engine's suspension request.
          grep -q "Runix ARM kernel: data session capability issued (account 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: data usage capability issued (account 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: data reconcile capability issued" /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized (Allow; " \
            /tmp/arm-boot.log
          # Roaming is not in the plan: denied, the home session is left open.
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (RoamingDataNotAllowed; " \
            /tmp/arm-boot.log
          # 900/1000 bytes: the engine REQUESTS a throttle (returned as code 2).
          grep -q "SVC: SYS_DATA_ACCOUNT account 0 bytes 900 authorized (.*request=Some(Throttle); returns request code 2)" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized (AllowThrottled; " \
            /tmp/arm-boot.log
          # 1600/1000 (>= 150%): the engine REQUESTS suspension (code 3). A request,
          # not an action: the session is still open for the reconcile below.
          grep -q "SVC: SYS_DATA_ACCOUNT account 0 bytes 700 authorized (.*request=Some(SuspendAccount); returns request code 3)" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; " \
            /tmp/arm-boot.log
          # Reconciler, account still Active with an open session over its cap:
          # both drift incidents, printed and WORM-recorded as evidence only.
          grep -q "SVC: SYS_DATA_RECONCILE incident usage-over-cap-not-restricted account:0: expected Suspended, observed 1600/1000" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_RECONCILE incident anomalous-usage-no-escalation account:0: expected 150%, observed 1600/1000" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (2 incident(s);" /tmp/arm-boot.log
          # After the (existing, MARSHAL-gated) SUSPEND the usage incidents are gone;
          # the session left open on the force-disabled profile is a real finding.
          grep -q "SVC: SYS_DATA_RECONCILE incident session-without-enabled-profile session:0@0/0: expected Enabled, observed Disabled" \
            /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (1 incident(s);" /tmp/arm-boot.log
          # The caller closes it (audited), and the next reconcile is clean.
          grep -q "SVC: SYS_DATA_SESSION_CLOSE account 0 slot 0 profile 0 authorized" /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (0 incident(s);" /tmp/arm-boot.log
          # Fail closed on a profile that is not this account's (installed, never bound).
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 1 DENIED (profile not bound to this account" \
            /tmp/arm-boot.log
          # No capability for account 99: denied per call, before any state is read.
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 99 slot 0 DENIED" /tmp/arm-boot.log
          grep -q "SVC: SYS_DATA_ACCOUNT account 99 DENIED" /tmp/arm-boot.log
          # Not MARSHAL-gated: of the data actions, ONLY the usage-period reset
          # (data.reset_usage, below) is ever sent for evaluation. Any other
          # "MARSHAL evaluation for data..." line is a regression, and so is
          # more than one (the walk performs exactly one reset).
          if grep "MARSHAL evaluation for data" /tmp/arm-boot.log | grep -qvF "data.reset_usage"; then exit 1; fi
          test "$(grep -c "MARSHAL evaluation for data" /tmp/arm-boot.log)" -eq 1
          # Governed usage-period reset (SYS_DATA_RESET): it lifts a cap, so it is
          # capability-gated (data:reset:0, its own scope) AND MARSHAL-gated, and its
          # unreachable policy is FAIL-CLOSED (MarshalAction::unreachable_policy): a reset
          # restores service, so no MARSHAL verdict means no reset. This boot config has
          # no MARSHAL proxy (every evaluation reads Unreachable), so these assertions
          # PROVE the fail-closed behaviour: the walk's reset (after the second ENABLE,
          # usage 1600/1000, no session) is DENIED, audited to WORM as authorized=false,
          # the counter stays 1600, and the later session open stays DENIED CapExceeded.
          # The guestfwd steps below prove the Execute and Refuse sides.
          grep -q "Runix ARM kernel: data reset capability issued (account 0" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for data.reset_usage account=0: Unreachable" /tmp/arm-boot.log
          grep -qF "SVC: SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable: fail-closed for this action)" /tmp/arm-boot.log
          grep -qF "SVC: MARSHAL unreachable: fail-closed for this action denial audited to WORM (usage period in force -> new usage period (counter reset), authorized=false;" /tmp/arm-boot.log
          if grep -q "SVC: SYS_DATA_RESET account 0 authorized" /tmp/arm-boot.log; then exit 1; fi
          # Order matters: the evaluation precedes the denial; the SAME session open is
          # DENIED CapExceeded before the reset and STILL DENIED after it (the denied
          # reset left the cap in force: usage still 1600); the reconcile after it sees
          # the unchanged over-cap usage (one incident, no session open) rather than the
          # zero incidents a successful reset would give.
          sed -n '1,/SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable/p' /tmp/arm-boot.log > /tmp/arm-boot-pre-reset.log
          sed -n '/SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable/,$p' /tmp/arm-boot.log > /tmp/arm-boot-post-reset.log
          grep -q "MARSHAL evaluation for data.reset_usage account=0: Unreachable" /tmp/arm-boot-pre-reset.log
          test "$(grep -c "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; " /tmp/arm-boot-pre-reset.log)" -ge 2
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; .*used=1600 " /tmp/arm-boot-post-reset.log
          if grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized" /tmp/arm-boot-post-reset.log; then exit 1; fi
          grep -q "SVC: SYS_DATA_RECONCILE incident anomalous-usage-no-escalation account:0: expected 150%, observed 1600/1000" /tmp/arm-boot-post-reset.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (1 incident(s);" /tmp/arm-boot-post-reset.log
          if grep -q "incident usage-regression" /tmp/arm-boot.log; then exit 1; fi
          # Every fail-open success records that MARSHAL did NOT govern it (no proxy in
          # this boot config, so every gated syscall that proceeds was Unreachable).
          grep -qF "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot.log
          grep -qF "SVC: SYS_SIM_ENABLE slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot.log
          grep -qF "force-disable) [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot.log
          grep -qF "SVC: SYS_MVNO_REACTIVATE account 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot.log
          grep -qF "SVC: SYS_SIM_DELETE slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot.log
          # No capability for data:reset:99: denied before MARSHAL or any state.
          grep -q "SVC: SYS_DATA_RESET account 99 DENIED" /tmp/arm-boot.log
          # Billing periods (kernel-arm/src/data_state.rs, runix_mobile::period). A period
          # is DATA and nothing resets on a schedule: SYS_DATA_PERIOD is read-only ADVICE
          # computed from the generic timer when a CALLER asks. Account 0's DEMO period
          # starts at tick 0 and lasts 500 ms (from the counter frequency); the walk's
          # first PERIOD call runs >= ~2.3 s into the counter (measured, fast host; slower
          # runners only make it later), so "elapsed" is race-free: an elapsed period
          # stays elapsed. No new MARSHAL evaluation (the one-data-evaluation count above
          # still holds).
          grep -q "Runix ARM kernel: demo billing period installed (account 0, start tick 0, length " /tmp/arm-boot.log
          # First call, after the 700-byte feed: elapsed -> a reset is REQUESTED (code 1).
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*reset REQUESTED (advisory: nothing was reset); returns code 1)" /tmp/arm-boot-pre-reset.log
          # The request is WORM-recorded ONCE, worded as an advisory REQUEST (nothing was
          # reset), exactly like the usage feed's advisory entries.
          grep -q "SVC: SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded (advisory; nothing was reset; first requested at tick " /tmp/arm-boot-pre-reset.log
          test "$(grep -c "SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded" /tmp/arm-boot.log)" -eq 1
          # In this config the reset is DENIED (fail-closed), so it started no period:
          # the call after it STILL reads elapsed (code 1), never active (code 0), and no
          # "next billing period started" line exists.
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*returns code 1)" /tmp/arm-boot-post-reset.log
          test "$(grep -c "SVC: SYS_DATA_PERIOD account 0 authorized" /tmp/arm-boot.log)" -eq 2
          if grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (.*returns code 0)" /tmp/arm-boot.log; then exit 1; fi
          if grep -q "next billing period started" /tmp/arm-boot.log; then exit 1; fi
          # No capability for data:session:99: denied before any period is read.
          grep -q "SVC: SYS_DATA_PERIOD account 99 DENIED" /tmp/arm-boot.log
          # The live reconciler's grace (20 s DEMO) is far longer than the walk, so it
          # reports no period incident here and the incident counts above are unchanged
          # (the paths that DO fire are proven on synthetic ticks just below).
          if grep -q "period incident" /tmp/arm-boot.log; then exit 1; fi
          # EL1-only proof of assess_period / period_request / next_period / check_periods
          # on synthetic ticks (kernel-arm/src/period_proof.rs), including the
          # PeriodElapsedNoReset and ClockBeforeStart incidents the live walk cannot reach.
          grep -q "Runix ARM kernel: period proof next_period(reset at 3100) -> (3100, 500)" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: period proof incident account 2: clock at tick 1000 is before period start 5000" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: period proof incident account 1: period elapsed, no reset by tick 150 (now 1000)" /tmp/arm-boot.log
          grep -q "Runix ARM kernel: period proof PASS" /tmp/arm-boot.log
          if grep -q "Runix ARM kernel: period proof FAILED" /tmp/arm-boot.log; then exit 1; fi
          # Network selection driven by a registry account's standing (own local registry;
          # kernel-arm/src/mvno_proof.rs, EL1-only): allowed while Active,
          # refused once suspended.
          grep -q "Runix ARM kernel: MVNO network selection account 0 Active -> Allowed 310/260 (HomeNetwork)" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MVNO network selection account 0 Suspended -> Refused (AccountSuspended)" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: MVNO network selection PASS" /tmp/arm-boot.log
          # The suspend handshake must never report a leaked Enabled profile.
          if grep -q "AUDIT FAILED" /tmp/arm-boot.log; then exit 1; fi
          # Beta mobile item 2.5, "Stage 3: real outbound TCP at EL0"
          # (kernel-arm/src/tcp_proof.rs): a genuine compiled
          # net-driver-host-arm binary, loaded as its own EL0 process with a
          # capability-gated virtio-mmio window (check_mmio_window's first
          # real caller) and physically contiguous virtqueue regions, probes
          # the net device, negotiates real virtqueues, and completes a real
          # TCP round trip against tcp_proof_listener.py through the
          # `guestfwd` bridge above -- the same dual-ended "exact bytes, not
          # just connected" discipline net_driver_tcp.rs already proves on
          # x86_64. `result=0 (Pass)` is `net-driver-host-arm`'s own
          # ProofResult, reported through SYS_NET_PROOF_DONE and read back
          # here as hardware-observed state (SPSR_EL1/TTBR0_EL1), not this
          # code's bookkeeping -- see tcp_proof.rs's own doc comment.
          grep -q "Runix ARM kernel: net TCP proof observed SPSR_EL1=.* result=0 (Pass)" \
            /tmp/arm-boot.log
          grep -q "Runix ARM kernel: net TCP proof PASS" /tmp/arm-boot.log
          # Evaluation reclamation (Beta item 3.4 follow-up): every MARSHAL evaluation
          # builds and runs a fresh EL0 process; before this, nothing freed its address
          # space or thread stack and the 4 MiB heap was exhausted after ~8 evaluations
          # per boot, which made MARSHAL silently stop being consulted. The proof runs
          # 24 evaluations with no network and asserts the free-heap watermark does not
          # drain (a leak makes it print FAIL, or the later real evaluations hit
          # "setup failed (out of memory ...)").
          grep -q "Runix ARM kernel: evaluation reclamation PASS (24 runs" /tmp/arm-boot.log
      - name: boot in QEMU without secure=on and check the no-EL3 path
        # Regression check for a real, previously-shipped bug: this used to
        # produce zero UART output (rust_start ran the EL3-only phase
        # unconditionally, which UNDEFINED-traps from EL1 with no VBAR_EL1
        # installed yet to catch it) -- see main.rs's doc comment and
        # docs/STATUS.md's "Real bugs" section for the full account.
        # See the secure boot step above: `timeout` is 25 s, set from MEASUREMENT (9 CI runs, per-line runner
        # timestamps): this step's last required serial line appears within
        # ~1-6 s of the first serial line (worst case ~7 s once Beta item 4's
        # data reset adds an eighth MARSHAL evaluation), so 25 s is ~3.6x the
        # worst case. The guest idles forever after its demo, so `timeout` always
        # kills QEMU and a step's wall-clock is ~N regardless of the boot; only
        # time-to-last-required-line matters. Runner speed varied ~2.4x between
        # identical runs, so do not tighten further without more data.
        run: |
          python3 ../kernel/tests/support/tcp_proof_listener.py &
          sleep 0.3
          timeout 25 qemu-system-aarch64 \
            -M virt,gic-version=2 -cpu cortex-a53 -nographic \
            -kernel target/aarch64-unknown-none/release/runix-kernel-arm \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001" \
            -device virtio-net-device,netdev=net0 \
            -global virtio-mmio.force-legacy=false \
            | tee /tmp/arm-boot-nosecure.log || true
          grep -q "Runix ARM kernel: boot OK" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: CurrentEL = EL1" /tmp/arm-boot-nosecure.log
          grep -q "no EL3 present -- skipping" /tmp/arm-boot-nosecure.log
          # Must NOT claim a security-state switch that never happened.
          grep -q "no EL3 ever ran, so no security-state switch to report" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MMU enabled" /tmp/arm-boot-nosecure.log
          # Same virtio-mmio discovery + ARP round-trip assertions as the
          # secure boot above (see its comments) -- both run in
          # `nonsecure.rs`'s shared EL1 bring-up, so they must work on both
          # entry paths, not just the EL3 one.
          grep -q "Runix ARM kernel: virtio-mmio net device at slot " /tmp/arm-boot-nosecure.log
          grep -q "MAC 52:54:00:12:34:56" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: virtio-net ARP reply from 10.0.2.2, sender MAC 52:55:0a:00:02:02" \
            /tmp/arm-boot-nosecure.log
          # Same per-process address-space proof as the secure boot above
          # (see its comments) -- `process.rs`'s TTBR0_EL1 switch is EL1-side
          # and security-state-independent, so it must hold on both entry
          # paths.
          grep -q "Runix ARM kernel: address-space isolation VA 0x80123000 A=0xaa B=0xbb" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: address-space isolation PASS" /tmp/arm-boot-nosecure.log
          # Same ELF loader proof as the secure boot above (see its comments
          # for what each line means) -- loader.rs is EL1-side and
          # security-state-independent, so it must hold on both entry paths.
          grep -q "Runix ARM kernel: ELF load content text=1f2003d5 data=runix bss_nonzero_bytes=0" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: ELF load W^X text AP=0b11 UXN=0 PXN=1, data AP=0b01 UXN=1 PXN=1, stack AP=0b01 UXN=1 PXN=1" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: ELF load EL0 access (AT S1E0R/S1E0W) text read=ok write=fault, data read=ok write=ok" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: ELF loader PASS" /tmp/arm-boot-nosecure.log
          # Same scheduler interleaving proof as the secure boot above (see
          # its comments) -- scheduler.rs is EL1-side and
          # security-state-independent, so it must hold on both entry paths.
          grep -q "Runix ARM kernel: scheduler init (cooperative, DAIF=0x3c0" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: scheduler interleaving A0,B0,C0,A1,B1,C1,A2,B2,C2" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: scheduler PASS" /tmp/arm-boot-nosecure.log
          # Same first-real-EL0-process proof as the secure boot above (see
          # its comments for what each line actually proves) -- el0_proof.rs
          # is EL1/EL0-side and security-state-independent, so it must hold
          # on both entry paths. Independently reproduced: both boots print
          # the identical roots, ELR_EL1, and payload bytes.
          grep -q "Runix ARM kernel: EL0 process observed SPSR_EL1=0x3c0 (M=0x0, EL0t=true)" \
            /tmp/arm-boot-nosecure.log
          grep -q "inside loaded text 0x80400000..0x80401000: true" /tmp/arm-boot-nosecure.log
          grep -q "AT S1E0R data=ok" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: EL0 process payload magic=0x7e witness=0x5a stack=0x42" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: EL0 process PASS" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: EL0 process boot thread resumed, TTBR0_EL1=0x.* (kernel table), TTBR0_EL1 writes=2 elided=" \
            /tmp/arm-boot-nosecure.log
          grep -q "^UB$" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_RIL_ACCESS channel 0 authorized" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_RIL_RECV channel 0 authorized, byte 0x41" \
            /tmp/arm-boot-nosecure.log
          grep -q "^A$" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_INSTALL slot 0 profile 0 identity 0x1234 authorized" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_STATUS slot 0 profile 0 authorized, state Deleted" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_CREATE slot 99 DENIED" /tmp/arm-boot-nosecure.log
          # Same general-purpose IPC round trip + denial as the secure boot
          # above (see its comments) -- ipc_channel.rs and its capability
          # check are security-state-independent, so they must hold on both
          # entry paths.
          grep -q "SVC: SYS_IPC_SEND channel 0 byte 0x49 authorized" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_IPC_RECV channel 0 authorized, byte 0x49" \
            /tmp/arm-boot-nosecure.log
          grep -q "^I$" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_IPC_RECV channel 99 DENIED" /tmp/arm-boot-nosecure.log
          # MVNO account layer (Beta item 3.3: kernel-arm/src/mvno.rs wrapping
          # runix-mobile). Account 0 is compiled-in demo data; the walk binds
          # profile 0 before the first enable, then suspends the account while
          # the profile is Enabled (forced disable + clean audit), shows enable
          # DENIED under the Suspended account, reactivates, and re-enables.
          # An installed-but-never-bound profile is DENIED too (fail closed), and
          # account 99 (no capability) is DENIED. The MVNO syscalls are
          # capability-gated, then MARSHAL-gated (Beta item 3.4), then audited;
          # with no proxy route in this boot config the gate reads Unreachable
          # (fail-open), see the MARSHAL evaluation greps below.
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 authorized (1 Enabled profile(s) to force-disable)" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 forced disable slot 0 profile 0 ok" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 audit clean" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 0 DENIED (MVNO AccountNotActive(Suspended))" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_REACTIVATE account 0 authorized" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_DELETE slot 0 profile 0 unbound from account 0" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 1 DENIED (MVNO NotBound)" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_BIND account 99 slot 0 profile 1 DENIED" /tmp/arm-boot-nosecure.log
          # Account capability held, profile capability (sim:0:2) NOT: BIND
          # needs both, and the DENIED line names the failing resource.
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 2 DENIED (resource sim:0:2" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 99 DENIED" /tmp/arm-boot-nosecure.log
          # Beta item 3.4 MARSHAL gate on the MVNO syscalls: Unreachable
          # (fail-open) here, same as the secure boot above.
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.bind_profile account=0 slot=0 profile=0: Unreachable" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.suspend_account account=0: Unreachable" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.reactivate_account account=0: Unreachable" \
            /tmp/arm-boot-nosecure.log
          # Data policy layer (Beta item 4.3: kernel-arm/src/data.rs +
          # data_state.rs/data_codes.rs wrapping runix_mobile::policy and
          # ::reconcile). The engine only REQUESTS and the reconciler only
          # OBSERVES; the requests are carried out by the caller through the
          # existing governed syscalls, so none of the four of them is MARSHAL-gated
          # (asserted below: the only data action ever evaluated is the reset).
          # Account 0 is compiled-in DEMO data: cap 1000 bytes, throttle at
          # 80%, no roaming, suspension requested at 150%. The walk runs it
          # between the first ENABLE and the existing SUSPEND(0), which is the
          # caller carrying out the engine's suspension request.
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized (Allow; " \
            /tmp/arm-boot-nosecure.log
          # Roaming is not in the plan: denied, the home session is left open.
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (RoamingDataNotAllowed; " \
            /tmp/arm-boot-nosecure.log
          # 900/1000 bytes: the engine REQUESTS a throttle (returned as code 2).
          grep -q "SVC: SYS_DATA_ACCOUNT account 0 bytes 900 authorized (.*request=Some(Throttle); returns request code 2)" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized (AllowThrottled; " \
            /tmp/arm-boot-nosecure.log
          # 1600/1000 (>= 150%): the engine REQUESTS suspension (code 3). A request,
          # not an action: the session is still open for the reconcile below.
          grep -q "SVC: SYS_DATA_ACCOUNT account 0 bytes 700 authorized (.*request=Some(SuspendAccount); returns request code 3)" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; " \
            /tmp/arm-boot-nosecure.log
          # Reconciler, account still Active with an open session over its cap:
          # both drift incidents, printed and WORM-recorded as evidence only.
          grep -q "SVC: SYS_DATA_RECONCILE incident usage-over-cap-not-restricted account:0: expected Suspended, observed 1600/1000" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_RECONCILE incident anomalous-usage-no-escalation account:0: expected 150%, observed 1600/1000" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (2 incident(s);" /tmp/arm-boot-nosecure.log
          # After the (existing, MARSHAL-gated) SUSPEND the usage incidents are gone;
          # the session left open on the force-disabled profile is a real finding.
          grep -q "SVC: SYS_DATA_RECONCILE incident session-without-enabled-profile session:0@0/0: expected Enabled, observed Disabled" \
            /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (1 incident(s);" /tmp/arm-boot-nosecure.log
          # The caller closes it (audited), and the next reconcile is clean.
          grep -q "SVC: SYS_DATA_SESSION_CLOSE account 0 slot 0 profile 0 authorized" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (0 incident(s);" /tmp/arm-boot-nosecure.log
          # Fail closed on a profile that is not this account's (installed, never bound).
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 1 DENIED (profile not bound to this account" \
            /tmp/arm-boot-nosecure.log
          # No capability for account 99: denied per call, before any state is read.
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 99 slot 0 DENIED" /tmp/arm-boot-nosecure.log
          grep -q "SVC: SYS_DATA_ACCOUNT account 99 DENIED" /tmp/arm-boot-nosecure.log
          # Not MARSHAL-gated: of the data actions, ONLY the usage-period reset
          # (data.reset_usage, below) is ever sent for evaluation. Any other
          # "MARSHAL evaluation for data..." line is a regression, and so is
          # more than one (the walk performs exactly one reset).
          if grep "MARSHAL evaluation for data" /tmp/arm-boot-nosecure.log | grep -qvF "data.reset_usage"; then exit 1; fi
          test "$(grep -c "MARSHAL evaluation for data" /tmp/arm-boot-nosecure.log)" -eq 1
          # Governed usage-period reset (SYS_DATA_RESET): it lifts a cap, so it is
          # capability-gated (data:reset:0, its own scope) AND MARSHAL-gated, and its
          # unreachable policy is FAIL-CLOSED (MarshalAction::unreachable_policy): a reset
          # restores service, so no MARSHAL verdict means no reset. This boot config has
          # no MARSHAL proxy (every evaluation reads Unreachable), so these assertions
          # PROVE the fail-closed behaviour: the walk's reset (after the second ENABLE,
          # usage 1600/1000, no session) is DENIED, audited to WORM as authorized=false,
          # the counter stays 1600, and the later session open stays DENIED CapExceeded.
          # The guestfwd steps below prove the Execute and Refuse sides.
          grep -q "Runix ARM kernel: data reset capability issued (account 0" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for data.reset_usage account=0: Unreachable" /tmp/arm-boot-nosecure.log
          grep -qF "SVC: SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable: fail-closed for this action)" /tmp/arm-boot-nosecure.log
          grep -qF "SVC: MARSHAL unreachable: fail-closed for this action denial audited to WORM (usage period in force -> new usage period (counter reset), authorized=false;" /tmp/arm-boot-nosecure.log
          if grep -q "SVC: SYS_DATA_RESET account 0 authorized" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # Order matters: the evaluation precedes the denial; the SAME session open is
          # DENIED CapExceeded before the reset and STILL DENIED after it (the denied
          # reset left the cap in force: usage still 1600); the reconcile after it sees
          # the unchanged over-cap usage (one incident, no session open) rather than the
          # zero incidents a successful reset would give.
          sed -n '1,/SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable/p' /tmp/arm-boot-nosecure.log > /tmp/arm-boot-nosecure-pre-reset.log
          sed -n '/SYS_DATA_RESET account 0 DENIED (MARSHAL unreachable/,$p' /tmp/arm-boot-nosecure.log > /tmp/arm-boot-nosecure-post-reset.log
          grep -q "MARSHAL evaluation for data.reset_usage account=0: Unreachable" /tmp/arm-boot-nosecure-pre-reset.log
          test "$(grep -c "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; " /tmp/arm-boot-nosecure-pre-reset.log)" -ge 2
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; .*used=1600 " /tmp/arm-boot-nosecure-post-reset.log
          if grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized" /tmp/arm-boot-nosecure-post-reset.log; then exit 1; fi
          grep -q "SVC: SYS_DATA_RECONCILE incident anomalous-usage-no-escalation account:0: expected 150%, observed 1600/1000" /tmp/arm-boot-nosecure-post-reset.log
          grep -q "SVC: SYS_DATA_RECONCILE authorized (1 incident(s);" /tmp/arm-boot-nosecure-post-reset.log
          if grep -q "incident usage-regression" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # Every fail-open success records that MARSHAL did NOT govern it (no proxy in
          # this boot config, so every gated syscall that proceeds was Unreachable).
          grep -qF "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot-nosecure.log
          grep -qF "SVC: SYS_SIM_ENABLE slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot-nosecure.log
          grep -qF "force-disable) [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot-nosecure.log
          grep -qF "SVC: SYS_MVNO_REACTIVATE account 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot-nosecure.log
          grep -qF "SVC: SYS_SIM_DELETE slot 0 profile 0 authorized [MARSHAL verdict: Unreachable (fail-open: not governed)]" /tmp/arm-boot-nosecure.log
          # No capability for data:reset:99: denied before MARSHAL or any state.
          grep -q "SVC: SYS_DATA_RESET account 99 DENIED" /tmp/arm-boot-nosecure.log
          # Billing periods (kernel-arm/src/data_state.rs, runix_mobile::period). A period
          # is DATA and nothing resets on a schedule: SYS_DATA_PERIOD is read-only ADVICE
          # computed from the generic timer when a CALLER asks. Account 0's DEMO period
          # starts at tick 0 and lasts 500 ms (from the counter frequency); the walk's
          # first PERIOD call runs >= ~2.3 s into the counter (measured, fast host; slower
          # runners only make it later), so "elapsed" is race-free: an elapsed period
          # stays elapsed. No new MARSHAL evaluation (the one-data-evaluation count above
          # still holds).
          grep -q "Runix ARM kernel: demo billing period installed (account 0, start tick 0, length " /tmp/arm-boot-nosecure.log
          # First call, after the 700-byte feed: elapsed -> a reset is REQUESTED (code 1).
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*reset REQUESTED (advisory: nothing was reset); returns code 1)" /tmp/arm-boot-nosecure-pre-reset.log
          # The request is WORM-recorded ONCE, worded as an advisory REQUEST (nothing was
          # reset), exactly like the usage feed's advisory entries.
          grep -q "SVC: SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded (advisory; nothing was reset; first requested at tick " /tmp/arm-boot-nosecure-pre-reset.log
          test "$(grep -c "SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded" /tmp/arm-boot-nosecure.log)" -eq 1
          # In this config the reset is DENIED (fail-closed), so it started no period:
          # the call after it STILL reads elapsed (code 1), never active (code 0), and no
          # "next billing period started" line exists.
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*returns code 1)" /tmp/arm-boot-nosecure-post-reset.log
          test "$(grep -c "SVC: SYS_DATA_PERIOD account 0 authorized" /tmp/arm-boot-nosecure.log)" -eq 2
          if grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (.*returns code 0)" /tmp/arm-boot-nosecure.log; then exit 1; fi
          if grep -q "next billing period started" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # No capability for data:session:99: denied before any period is read.
          grep -q "SVC: SYS_DATA_PERIOD account 99 DENIED" /tmp/arm-boot-nosecure.log
          # The live reconciler's grace (20 s DEMO) is far longer than the walk, so it
          # reports no period incident here and the incident counts above are unchanged
          # (the paths that DO fire are proven on synthetic ticks just below).
          if grep -q "period incident" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # EL1-only proof of assess_period / period_request / next_period / check_periods
          # on synthetic ticks (kernel-arm/src/period_proof.rs), including the
          # PeriodElapsedNoReset and ClockBeforeStart incidents the live walk cannot reach.
          grep -q "Runix ARM kernel: period proof next_period(reset at 3100) -> (3100, 500)" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: period proof incident account 2: clock at tick 1000 is before period start 5000" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: period proof incident account 1: period elapsed, no reset by tick 150 (now 1000)" /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: period proof PASS" /tmp/arm-boot-nosecure.log
          if grep -q "Runix ARM kernel: period proof FAILED" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # Network selection driven by a registry account's standing (own local registry;
          # kernel-arm/src/mvno_proof.rs, EL1-only): allowed while Active,
          # refused once suspended.
          grep -q "Runix ARM kernel: MVNO network selection account 0 Active -> Allowed 310/260 (HomeNetwork)" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MVNO network selection account 0 Suspended -> Refused (AccountSuspended)" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: MVNO network selection PASS" /tmp/arm-boot-nosecure.log
          # The suspend handshake must never report a leaked Enabled profile.
          if grep -q "AUDIT FAILED" /tmp/arm-boot-nosecure.log; then exit 1; fi
          # Same net TCP proof as the secure boot above (see its comments)
          # -- tcp_proof.rs's address-space/loader/scheduler work is EL1/
          # EL0-side and security-state-independent, so it must hold on both
          # entry paths.
          grep -q "Runix ARM kernel: net TCP proof observed SPSR_EL1=.* result=0 (Pass)" \
            /tmp/arm-boot-nosecure.log
          grep -q "Runix ARM kernel: net TCP proof PASS" /tmp/arm-boot-nosecure.log
          # Evaluation reclamation (Beta item 3.4 follow-up): every MARSHAL evaluation
          # builds and runs a fresh EL0 process; before this, nothing freed its address
          # space or thread stack and the 4 MiB heap was exhausted after ~8 evaluations
          # per boot, which made MARSHAL silently stop being consulted. The proof runs
          # 24 evaluations with no network and asserts the free-heap watermark does not
          # drain (a leak makes it print FAIL, or the later real evaluations hit
          # "setup failed (out of memory ...)").
          grep -q "Runix ARM kernel: evaluation reclamation PASS (24 runs" /tmp/arm-boot-nosecure.log
      # Beta mobile item 2.6, "Stage 4: wire esim_marshal::evaluate to a real
      # transport" -- the fail-closed case. `nonsecure.rs` always points
      # marshal_transport's MARSHAL proxy at 10.0.2.100:9100; the two boot
      # steps above leave that port unmapped (proving fail-open, see their
      # own comments) -- this step instead bridges it to
      # arm_marshal_selective_listener.py (a test-only stand-in that answers
      # the real wire format, same role marshal_proof_listener.py plays for
      # marshal_tcp_roundtrip.rs -- not itself a MARSHAL proxy; it reuses
      # grid_sandbox_marshal_shadow_listener.py's wire helpers). Since Beta
      # item 3.4 the EL0 walk's first gated syscall is MVNO bind, not eSIM
      # enable, and the old Refuse-everything/serve-one-connection listener
      # could only ever prove the first one -- the selective listener serves
      # many connections and refuses only the action types named by
      # `--refuse` prefixes (here `esim.`: bind/suspend/reactivate Execute,
      # enable/delete Refuse). Two `guestfwd` routes in one `-netdev user,...`
      # string: 9000 for tcp_proof.rs's own already-running TCP proof
      # (unrelated to this step, but still exercised every boot), 9100 for
      # this step's actual subject. Background listeners are killed on step
      # exit (the selective listener never exits on its own and the next step
      # reuses its port).
      - name: boot in QEMU and check MARSHAL REFUSE denies eSIM enable (Beta item 2.6)
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          python3 ../kernel/tests/support/tcp_proof_listener.py &
          sleep 0.3
          python3 ../kernel/tests/support/arm_marshal_selective_listener.py 9004 --refuse esim. &
          sleep 0.3
          # `timeout` is 25 s, set from MEASUREMENT (9 CI runs, per-line runner
          # timestamps): this step's last required serial line appears within
          # ~1-6 s of the first serial line (worst case ~7 s once Beta item 4's
          # data reset adds an eighth MARSHAL evaluation), so 25 s is ~3.6x the
          # worst case. The guest idles forever after its demo, so `timeout` always
          # kills QEMU and a step's wall-clock is ~N regardless of the boot; only
          # time-to-last-required-line matters. Runner speed varied ~2.4x between
          # identical runs, so do not tighten further without more data.
          timeout 25 qemu-system-aarch64 \
            -M virt,secure=on,gic-version=2 -cpu cortex-a53 -nographic \
            -kernel target/aarch64-unknown-none/release/runix-kernel-arm \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001,guestfwd=tcp:10.0.2.100:9100-cmd:nc 127.0.0.1 9004" \
            -device virtio-net-device,netdev=net0 \
            -global virtio-mmio.force-legacy=false \
            | tee /tmp/arm-boot-marshal-refuse.log || true
          grep -q "Runix ARM kernel: MARSHAL evaluation for enable slot=0 profile=0: Refuse" \
            /tmp/arm-boot-marshal-refuse.log
          # The real enforcement outcome: a reachable Refuse now actually
          # blocks the syscall, replacing this same boot config's own
          # unconfigured "... authorized" line with a DENIED one -- the
          # literal point of this item.
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 0 DENIED (MARSHAL Refuse)" \
            /tmp/arm-boot-marshal-refuse.log
          # The selective listener executes the MVNO actions, so bind still
          # succeeded here (the profile is bound and enable reached MARSHAL).
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.bind_profile account=0 slot=0 profile=0: Execute" \
            /tmp/arm-boot-marshal-refuse.log
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized" \
            /tmp/arm-boot-marshal-refuse.log
          # Only esim.* is refused, so the data usage-period reset still Executes.
          grep -q "Runix ARM kernel: MARSHAL evaluation for data.reset_usage account=0: Execute" \
            /tmp/arm-boot-marshal-refuse.log
          grep -q "SVC: SYS_DATA_RESET account 0 authorized" /tmp/arm-boot-marshal-refuse.log
          # ...and the success records the REAL verdict (a reachable MARSHAL
          # answered), not the ungoverned fail-open text.
          grep -qF "SVC: SYS_DATA_RESET account 0 authorized (usage 1600 -> 0; new period; MARSHAL verdict: Execute; " /tmp/arm-boot-marshal-refuse.log
          grep -qF "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized [MARSHAL verdict: Execute]" /tmp/arm-boot-marshal-refuse.log
          # Billing period (SYS_DATA_PERIOD), race-free assertions only: the first call
          # runs >= ~2.3 s into the counter against a 500 ms demo period that started
          # at tick 0, so it reads elapsed (code 1) on any host (the counter only grows);
          # the denial for account 99 and the EL1-only period proof do not depend on timing.
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*returns code 1)" /tmp/arm-boot-marshal-refuse.log
          grep -q "SVC: SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded (advisory; nothing was reset; first requested at tick " /tmp/arm-boot-marshal-refuse.log
          grep -q "SVC: SYS_DATA_PERIOD account 99 DENIED" /tmp/arm-boot-marshal-refuse.log
          grep -q "Runix ARM kernel: period proof PASS" /tmp/arm-boot-marshal-refuse.log
          # The reset was AUTHORIZED here, so it started the next billing period (the
          # deterministic serial line). Whether the PERIOD call right after it reads active
          # is NOT asserted: it is active only if under 500 ms passed between the two
          # calls (~15 ms measured), which a stalled runner could break; the plain boots
          # above assert the opposite, race-free case (a denied reset starts no period).
          grep -q "SVC: SYS_DATA_RESET account 0 billing period: next billing period started at tick [0-9]* (length [0-9]* ticks); reset request cleared" /tmp/arm-boot-marshal-refuse.log

      # Beta item 3.4: the MVNO MARSHAL gate itself. Same bridge as above, but
      # the selective listener Refuses only `mvno.suspend_account`: the walk's
      # SYS_MVNO_SUSPEND must be DENIED at the syscall boundary with the
      # registry untouched -- no "authorized", no forced disable, no audit
      # line for it (those only print after the gate passes).
      - name: boot in QEMU and check MARSHAL REFUSE denies MVNO suspend (Beta item 3.4)
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          python3 ../kernel/tests/support/tcp_proof_listener.py &
          sleep 0.3
          python3 ../kernel/tests/support/arm_marshal_selective_listener.py 9004 --refuse mvno.suspend_account --refuse data.reset_usage &
          sleep 0.3
          # See the step above: `timeout` is 25 s, set from MEASUREMENT (9 CI runs, per-line runner
          # timestamps): this step's last required serial line appears within
          # ~1-6 s of the first serial line (worst case ~7 s once Beta item 4's
          # data reset adds an eighth MARSHAL evaluation), so 25 s is ~3.6x the
          # worst case. The guest idles forever after its demo, so `timeout` always
          # kills QEMU and a step's wall-clock is ~N regardless of the boot; only
          # time-to-last-required-line matters. Runner speed varied ~2.4x between
          # identical runs, so do not tighten further without more data.
          timeout 25 qemu-system-aarch64 \
            -M virt,secure=on,gic-version=2 -cpu cortex-a53 -nographic \
            -kernel target/aarch64-unknown-none/release/runix-kernel-arm \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001,guestfwd=tcp:10.0.2.100:9100-cmd:nc 127.0.0.1 9004" \
            -device virtio-net-device,netdev=net0 \
            -global virtio-mmio.force-legacy=false \
            | tee /tmp/arm-boot-marshal-refuse-mvno.log || true
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.suspend_account account=0: Refuse" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 DENIED (MARSHAL Refuse)" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          # Registry untouched: the suspend body never ran.
          if grep -q "SVC: SYS_MVNO_SUSPEND account 0 authorized" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
          if grep -q "SVC: SYS_MVNO_SUSPEND account 0 forced disable" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
          if grep -q "SVC: SYS_MVNO_SUSPEND account 0 audit clean" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
          # The other gated syscalls were evaluated and executed normally.
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.bind_profile account=0 slot=0 profile=0: Execute" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "SVC: SYS_MVNO_BIND account 0 slot 0 profile 0 authorized" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          # The data usage-period reset is Refused too (second --refuse above): the
          # governed lift of the cap is DENIED at the syscall boundary and the
          # counter is untouched, so service is still withheld afterwards.
          grep -q "Runix ARM kernel: MARSHAL evaluation for data.reset_usage account=0: Refuse" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "SVC: SYS_DATA_RESET account 0 DENIED (MARSHAL Refuse)" \
            /tmp/arm-boot-marshal-refuse-mvno.log
          if grep -q "SVC: SYS_DATA_RESET account 0 authorized" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
          sed -n '/SYS_DATA_RESET account 0 DENIED (MARSHAL Refuse)/,$p' /tmp/arm-boot-marshal-refuse-mvno.log > /tmp/arm-boot-marshal-refuse-mvno-post-reset.log
          grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 DENIED (CapExceeded; .*used=1600 " \
            /tmp/arm-boot-marshal-refuse-mvno-post-reset.log
          if grep -q "SVC: SYS_DATA_SESSION_OPEN account 0 slot 0 profile 0 authorized" /tmp/arm-boot-marshal-refuse-mvno-post-reset.log; then exit 1; fi
          # Billing period (SYS_DATA_PERIOD), race-free assertions only: the first call
          # runs >= ~2.3 s into the counter against a 500 ms demo period that started
          # at tick 0, so it reads elapsed (code 1) on any host (the counter only grows);
          # the denial for account 99 and the EL1-only period proof do not depend on timing.
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*returns code 1)" /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "SVC: SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded (advisory; nothing was reset; first requested at tick " /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "SVC: SYS_DATA_PERIOD account 99 DENIED" /tmp/arm-boot-marshal-refuse-mvno.log
          grep -q "Runix ARM kernel: period proof PASS" /tmp/arm-boot-marshal-refuse-mvno.log
          # The reset was DENIED here (Refuse), so no next period started: the PERIOD call
          # after it is still elapsed (code 1) -- race-free, an elapsed period only gets
          # more elapsed -- and no active (code 0) answer or "period started" line exists.
          test "$(grep -c "SVC: SYS_DATA_PERIOD account 0 authorized (.*returns code 1)" /tmp/arm-boot-marshal-refuse-mvno.log)" -eq 2
          if grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (.*returns code 0)" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
          if grep -q "next billing period started" /tmp/arm-boot-marshal-refuse-mvno.log; then exit 1; fi
      # Full real chain, the third case the REFUSE/Unreachable configs above
      # can't distinguish on their own (a Refuse from a canned stand-in
      # listener proves the transport, not that the real proxy's policy
      # layer admits an eSIM action at all): the `guestfwd` route for 9100
      # now lands on the REAL `citadel_proxy` binary, which parses the
      # kernel's `esim.enable` envelope, runs desktop/src/citadel/policy.rs's
      # check (which recognizes `esim.enable`/`esim.delete` and requires
      # slot+profile), attaches its own distinct Verifier identity, and
      # makes a real HTTP call to mock_citadel_server.py (canned EXECUTE).
      # Ports: 9105 (mock CITADEL HTTP) <- citadel_proxy 9104 <- guestfwd
      # 10.0.2.100:9100. The mock is mock_citadel_server_multi.py, not
      # mock_citadel_server.py: since Beta item 3.4 the walk performs seven
      # evaluations per boot (eSIM enable/delete and the three MVNO
      # syscalls), and the governed data reset adds an eighth
      # (data.reset_usage), each a fresh proxy request, and the one-shot original
      # serves exactly one and exits. The proxy must also recognize
      # mvno.bind_profile / mvno.suspend_account / mvno.reactivate_account
      # (desktop/src/citadel/policy.rs) or those lines read Unreachable/Refuse. Before the proxy learned `esim.*` this exact chain
      # answered `POLICY_REFUSE: action type "esim.enable" is not one this
      # proxy recognizes`, which would have failed the `: Execute` grep
      # below. (The same request/response was checked host-side, without
      # QEMU, against this exact proxy + mock pair; the QEMU leg of this
      # step is first exercised by CI.)
      - name: build citadel_proxy (payload for the eSIM Execute boot config)
        working-directory: .
        run: cargo build -p runix-desktop --bin citadel_proxy --release
      - name: boot in QEMU and check a real citadel_proxy EXECUTE admits eSIM enable (Beta item 2.6 follow-up)
        run: |
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          python3 ../kernel/tests/support/tcp_proof_listener.py &
          sleep 0.3
          python3 ../kernel/tests/support/mock_citadel_server_multi.py &
          sleep 0.3
          CITADEL_PROXY_LISTEN_ADDR=127.0.0.1:9104 \
            RUNIX_CITADEL_URL=http://127.0.0.1:9105/marshal/kerkese \
            ../target/release/citadel_proxy &
          sleep 0.3
          # `timeout` is 25 s, set from MEASUREMENT (9 CI runs, per-line runner
          # timestamps): this step's last required serial line appears within
          # ~1-6 s of the first serial line (worst case ~7 s once Beta item 4's
          # data reset adds an eighth MARSHAL evaluation), so 25 s is ~3.6x the
          # worst case. The guest idles forever after its demo, so `timeout` always
          # kills QEMU and a step's wall-clock is ~N regardless of the boot; only
          # time-to-last-required-line matters. Runner speed varied ~2.4x between
          # identical runs, so do not tighten further without more data.
          timeout 25 qemu-system-aarch64 \
            -M virt,secure=on,gic-version=2 -cpu cortex-a53 -nographic \
            -kernel target/aarch64-unknown-none/release/runix-kernel-arm \
            -netdev "user,id=net0,guestfwd=tcp:10.0.2.100:9000-cmd:nc 127.0.0.1 9001,guestfwd=tcp:10.0.2.100:9100-cmd:nc 127.0.0.1 9104" \
            -device virtio-net-device,netdev=net0 \
            -global virtio-mmio.force-legacy=false \
            | tee /tmp/arm-boot-marshal-execute.log || true
          grep -q "Runix ARM kernel: MARSHAL evaluation for enable slot=0 profile=0: Execute" \
            /tmp/arm-boot-marshal-execute.log
          grep -q "SVC: SYS_SIM_ENABLE slot 0 profile 0 authorized" \
            /tmp/arm-boot-marshal-execute.log
          # Beta item 3.4: the real proxy admits the three MVNO actions end to
          # end (kernel request -> citadel_proxy policy -> mock CITADEL EXECUTE).
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.bind_profile account=0 slot=0 profile=0: Execute" \
            /tmp/arm-boot-marshal-execute.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.suspend_account account=0: Execute" \
            /tmp/arm-boot-marshal-execute.log
          grep -q "Runix ARM kernel: MARSHAL evaluation for mvno.reactivate_account account=0: Execute" \
            /tmp/arm-boot-marshal-execute.log
          grep -q "SVC: SYS_MVNO_SUSPEND account 0 authorized" \
            /tmp/arm-boot-marshal-execute.log
          # The governed data reset: the real proxy must recognize data.reset_usage
          # (desktop/src/citadel/policy.rs) or this reads Refuse and the reset is
          # DENIED.
          grep -q "Runix ARM kernel: MARSHAL evaluation for data.reset_usage account=0: Execute" \
            /tmp/arm-boot-marshal-execute.log
          grep -q "SVC: SYS_DATA_RESET account 0 authorized" /tmp/arm-boot-marshal-execute.log
          # The success lines record the real verdict (every evaluation above
          # was a reachable Execute), not the ungoverned fail-open text.
          grep -qF "SVC: SYS_DATA_RESET account 0 authorized (usage 1600 -> 0; new period; MARSHAL verdict: Execute; " /tmp/arm-boot-marshal-execute.log
          grep -qF "SVC: SYS_SIM_ENABLE slot 0 profile 0 authorized [MARSHAL verdict: Execute]" /tmp/arm-boot-marshal-execute.log
          # Billing period (SYS_DATA_PERIOD), race-free assertions only: the first call
          # runs >= ~2.3 s into the counter against a 500 ms demo period that started
          # at tick 0, so it reads elapsed (code 1) on any host (the counter only grows);
          # the denial for account 99 and the EL1-only period proof do not depend on timing.
          grep -q "SVC: SYS_DATA_PERIOD account 0 authorized (now tick [0-9]*; elapsed: .*returns code 1)" /tmp/arm-boot-marshal-execute.log
          grep -q "SVC: SYS_DATA_PERIOD account 0 reset REQUEST WORM-recorded (advisory; nothing was reset; first requested at tick " /tmp/arm-boot-marshal-execute.log
          grep -q "SVC: SYS_DATA_PERIOD account 99 DENIED" /tmp/arm-boot-marshal-execute.log
          grep -q "Runix ARM kernel: period proof PASS" /tmp/arm-boot-marshal-execute.log
          # The reset was AUTHORIZED here, so it started the next billing period (the
          # deterministic serial line). Whether the PERIOD call right after it reads active
          # is NOT asserted: it is active only if under 500 ms passed between the two
          # calls (~15 ms measured), which a stalled runner could break; the plain boots
          # above assert the opposite, race-free case (a denied reset starts no period).
          grep -q "SVC: SYS_DATA_RESET account 0 billing period: next billing period started at tick [0-9]* (length [0-9]* ticks); reset request cleared" /tmp/arm-boot-marshal-execute.log

  # Complements kernel-tests above: boots the *full* main.rs demo (every
  # phase's feature, not just basic_boot's minimal boot+CPU-init smoke
  # test) and greps its serial output. Coarser and more brittle than a real
  # exit code, but it's the only thing here that actually exercises
  # everything main.rs does end to end in one run.
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          targets: x86_64-unknown-none
          # `rust-src`: the `bootloader` crate's build script (invoked via
          # `xtask` in this job) compiles its own boot-sector/stage-2/3/4
          # helper binaries for bare-metal targets, which needs to build
          # core/alloc from source — without this component that fails with
          # "does not exist, unable to build with the standard library".
          components: llvm-tools, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kernel
            xtask
            grid-sandbox-host
            net-driver-host
            blk-driver-host
      # main.rs now `include_bytes!`s grid-sandbox-host's compiled output
      # directly (Phase B7 — see citadel.rs's doc comment), so the kernel
      # itself won't even compile without this built first, the same
      # ordering requirement kernel-tests' grid_sandbox_wasm job already
      # has for the same reason.
      - name: build grid-sandbox-host (payload for Phase B7)
        working-directory: grid-sandbox-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for net-driver-host (Phase B8).
      - name: build net-driver-host (payload for Phase B8)
        working-directory: net-driver-host
        run: cargo build --target x86_64-unknown-none --release
      # Same requirement, same reasoning, for blk-driver-host (Phase B9).
      - name: build blk-driver-host (payload for Phase B9)
        working-directory: blk-driver-host
        run: cargo build --target x86_64-unknown-none --release
      - name: install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: build boot image
        working-directory: xtask
        run: cargo run -- build --release
      - name: boot in QEMU and check for kernel serial output
        run: |
          # 150s, not 90: a legacy multi-stage BIOS boot (SeaBIOS -> this
          # crate's own stage 2/3/4 -> kernel ELF load) reading a
          # multi-megabyte payload has real, observed variance depending
          # on the runner's disk/CPU emulation path -- 20s was cutting it
          # close even before Phase B7 added a ~2 MB embedded binary to
          # read, and Phase B8 added a brute-force PCI config-space scan
          # (65,536 port-I/O round trips, kernel/src/pci.rs::scan) to the
          # main.rs boot path for the first time -- each trapped port I/O
          # instruction has real per-trap overhead under (possibly nested)
          # virtualization, and this run genuinely needed more than 90s to
          # reach its final "USR" print, confirmed by the boot log ending
          # mid-sequence at the timeout rather than failing a specific check.
          truncate -s 1M target/runix-blk-test.img
          timeout 150 qemu-system-x86_64 \
            -drive format=raw,file=target/runix-bios.img \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -drive if=none,id=blk0,file=target/runix-blk-test.img,format=raw \
            -device virtio-blk-pci,drive=blk0 \
            -serial stdio -display none -no-reboot -m 128M \
            | tee /tmp/boot.log || true
          grep -q "Runix kernel: boot OK" /tmp/boot.log
          grep -q "Runix kernel: CPU init OK" /tmp/boot.log
          grep -q "EXCEPTION: BREAKPOINT" /tmp/boot.log
          grep -q "Runix kernel: breakpoint exception handled, execution resumed" /tmp/boot.log
          grep -q "Runix kernel: memory init OK" /tmp/boot.log
          grep -q "Runix kernel: heap alloc test OK (box=41, vec_len=100, vec_sum=4950)" /tmp/boot.log
          grep -q "Runix kernel: interrupts enabled" /tmp/boot.log
          grep -q "Runix kernel: timer interrupt OK" /tmp/boot.log
          grep -q "Runix kernel: scheduler test OK" /tmp/boot.log
          # Fair round-robin, not just "didn't crash": each of the three
          # spawned threads must get all 3 of its turns, in order, before
          # the run ends — a scheduler that starves one thread or replays
          # another's context would produce a different sequence here.
          grep -q "thread A: iteration 2" /tmp/boot.log
          grep -q "thread B: iteration 2" /tmp/boot.log
          grep -q "thread C: iteration 2" /tmp/boot.log
          grep -q "Runix kernel: syscall ABI OK" /tmp/boot.log
          # The exact bytes, in order — proves the channel didn't drop,
          # duplicate, or reorder anything crossing the syscall boundary.
          grep -q "Runix kernel: IPC test OK (Phase 6: received \['X', 'Y', 'Z'\] via port 0)" /tmp/boot.log
          # Capability gate (B4): authorized sender's send lands (return 0),
          # unauthorized sender's is denied (return u64::MAX) before it ever
          # reaches the channel — only 'K' shows up, never 'X'.
          grep -q "thread sender_authorized: SYS_IPC_SEND returned 0" /tmp/boot.log
          grep -q "thread sender_unauthorized: SYS_IPC_SEND returned 18446744073709551615" /tmp/boot.log
          grep -q "Runix kernel: capability gate OK (Phase B4: port 1 received Some('K')" /tmp/boot.log
          # Revocation (B5): a token valid on every count verify() itself
          # checks (signature, expiry, resource) is still denied once
          # explicitly revoked — port 2 gets nothing.
          grep -q "thread sender_revoked: SYS_IPC_SEND returned 18446744073709551615" /tmp/boot.log
          grep -q "Runix kernel: capability revocation OK (Phase B5: port 2 received None" /tmp/boot.log
          # CITADEL (B6): demo call proves the allowlist gate itself works
          # — a module signed for its exact bytes is accepted, tampered
          # bytes are refused.
          grep -q "Runix kernel: CITADEL boot authorization OK (Phase B6: authorized=Ok(T2Trusted)" /tmp/boot.log
          # CITADEL (B7): the same gate, now actually deciding whether a
          # real binary (grid-sandbox-host) gets loaded and run at all —
          # authorized, then parsed/loaded/run as an isolated ring 3
          # process hosting wasmi, printing "Hi" via two host.print calls
          # that round-trip through the syscall gate.
          grep -q "Runix kernel: grid-sandbox-host authorized by CITADEL allowlist" /tmp/boot.log
          grep -q "Runix kernel: grid-sandbox-host loaded, entry point" /tmp/boot.log
          grep -q "^Hi" /tmp/boot.log
          grep -q "Runix kernel: grid-sandbox-host ran wasmi in an isolated ring 3 process" /tmp/boot.log
          # Network stack, Phase 2a (B8): the same CITADEL-gate-then-load
          # mechanism, this time for net-driver-host -- proves it probed the
          # real virtio-net device (QEMU's default MAC), brought up smoltcp
          # on top of the virtqueue transport, and got a real ICMP echo
          # reply back from QEMU/SLIRP (smoltcp's own ARP resolution of the
          # gateway is a transparent prerequisite here -- see
          # docs/STATUS.md's network-stack section), all from inside a
          # capability-gated ring 3 process with no raw port I/O privilege
          # of its own.
          grep -q "Runix kernel: net-driver-host authorized by CITADEL allowlist" /tmp/boot.log
          grep -q "Runix kernel: net-driver-host loaded, entry point" /tmp/boot.log
          grep -q "net-driver-host: virtio-net probed, MAC=52:54:00:12:34:56" /tmp/boot.log
          grep -q "net-driver-host: ICMP echo reply received (Phase 2a OK)" /tmp/boot.log
          grep -q "Runix kernel: net-driver-host spawned as an isolated ring 3 process" /tmp/boot.log
          # Filesystem driver, Phase 1 (B9): the same CITADEL-gate-then-load
          # mechanism, this time for blk-driver-host -- proves it probed the
          # real virtio-blk device and was spawned as a capability-gated
          # ring 3 process with no raw port I/O privilege of its own.
          grep -q "Runix kernel: blk-driver-host authorized by CITADEL allowlist" /tmp/boot.log
          grep -q "Runix kernel: blk-driver-host loaded, entry point" /tmp/boot.log
          grep -q "Runix kernel: blk-driver-host spawned as an isolated ring 3 process" /tmp/boot.log
          grep -q "Runix kernel: entering ring 3" /tmp/boot.log
          # Printed by user_hello() running at CPL 3, one byte per SYS_WRITE
          # syscall — proves the syscall gate's DPL actually admits a ring 3
          # caller, not just that the ring 0 -> ring 3 jump didn't fault.
          grep -q "^USR$" /tmp/boot.log
