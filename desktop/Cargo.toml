[package]
name = "runix-desktop"
description = "Runix desktop platform — shell, grid sandbox isolation, drivers. Beta/RC scope; placeholder for Alpha."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
runix-capability-manager = { path = "../capability-manager" }
runix-wasm-runtime = { path = "../wasm-runtime" }
runix-citadel-integration = { path = "../citadel-integration" }
# `citadel_proxy`'s wire format with a kernel/user-space caller — the typed
# `ipc` crate, not a hand-rolled payload (see `desktop/src/citadel/proxy.rs`).
# Default (`std`) features: this crate is a hosted `std` platform, unlike
# `net-driver-host`'s `default-features = false` use of this same crate.
runix-ipc = { path = "../ipc" }
# Used only to parse a real CITADEL Decision response body (via
# `citadel-kerkese-core::decision::Decision`, which already depends on
# `serde`/`serde_json` itself) in `citadel_proxy` — see that module's doc
# comment for why parsing the real type beats a hand-scraped `outcome`
# field.
serde_json = "1"
# Pinned to an exact `rev` (commit), never a floating branch — see
# docs/ROADMAP.md's Open Questions and deny.toml's `[sources]` section,
# which was updated in the same change that added this dependency.
citadel-kerkese-core = { git = "https://github.com/opensecstack/opensecstack", rev = "c21aedcb5efcf3b8de7be5d0861d70a7fdcbbc69" }
# `citadel_proxy`'s own Verifier identity (`desktop/src/citadel/identity.rs`)
# — signs the enriched Kerkese envelope's `sig_verifier` with a key
# deliberately distinct from any key `kernel/` holds. Plain `workspace =
# true` (unlike `capability-manager`'s `no_std` override of this same
# dependency): `desktop` is a hosted `std` platform, so the workspace's
# default features are fine here. The demo key is loaded from a fixed seed
# (`SigningKey::from_bytes`), never generated at runtime, so no
# `rand_core`/CSPRNG feature is needed.
ed25519-dalek = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
# Real UUIDs for `Kerkese.execution_id` — `citadel/internal/marshal/types.go`'s
# `Kerkese.ExecutionID` is a Go `uuid.UUID`, which fails to unmarshal from
# an arbitrary string (e.g. the kernel's own opaque `instance_id`) — see
# `desktop/src/citadel/identity.rs`'s `Kerkese::execution_id` doc comment.
uuid = { version = "1", features = ["v4"] }
# default-tls (not rustls-tls): on Windows this resolves to native-tls's
# `schannel` backend, which wraps the OS's SChannel APIs directly — no
# external OpenSSL install or C compiler needed, unlike rustls-tls's `ring`
# dependency (which needs a working `cc`/gcc and fails to build here; see
# docs/BUILDING.md's Windows MSVC/GNU nightly gotcha for the same class of
# issue).
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros"] }

[lib]
name = "runix_desktop"
