[package]
name = "blk-driver-host"
description = "Block driver host: a freestanding ring 3 binary running the legacy virtio-blk driver — Beta's filesystem-driver roadmap item, Phase 1 (transport only, no filesystem format parsing yet). Loaded via kernel/src/elf.rs and scheduler::spawn_ring3_process_with_capability, capability-gated port I/O only, never linked into the kernel itself."
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

# NOT a member of the root workspace — same reasoning as net-driver-host/
# grid-sandbox-host (see their own Cargo.toml comments): this targets
# `x86_64-unknown-none`, a different target than every host-side crate in
# the root workspace. Needs no nightly feature — see this crate's own
# rust-toolchain.toml.
[workspace]

[dependencies]
linked_list_allocator = "0.10"

[[bin]]
name = "blk-driver-host"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
