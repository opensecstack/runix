[package]
name = "runix-kernel-arm"
description = "Runix microkernel, ARM/TrustZone boot bring-up (mobile L1). Alpha scope: EL3 Secure Monitor boot, UART, exception vectors -- see src/main.rs's module doc comment for status and the naming/placement decision this crate represents."
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/opensecstack/runix"
publish = false

# NOT part of the root workspace, same reasoning as ../kernel and ../xtask
# (see the root Cargo.toml's own comment): this targets `aarch64-unknown-none`
# -- a third target triple alongside the root workspace's host target and
# `kernel`'s `x86_64-unknown-none`, none of which `cargo build --workspace`
# can mix into one invocation.
[workspace]

[dependencies]
# Reused directly, not reimplemented: capability-manager is already no_std +
# alloc (see its own Cargo.toml), platform-agnostic (Ed25519 over a
# canonical string, no x86_64-specific anything), and this is exactly the
# access-control primitive the x86_64 kernel's own SYS_IPC_SEND gate uses
# -- see kernel/src/capabilities.rs / kernel/src/syscall.rs for the pattern
# this crate's own capability-gated SVC mirrors.
runix-capability-manager = { path = "../capability-manager" }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# The same heap-allocator crate grid-sandbox-host uses for its own ring 3
# (x86_64) private heap -- capability-manager needs `alloc` (String/Vec),
# and nothing in this crate has ever needed a heap before now.
linked_list_allocator = "0.10"
spin = "0.9"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
