[package]
name = "runix-citadel-integration"
description = "CITADEL boundary: signed boot-time module authorization today; MARSHAL 5-gate evaluation, WORM audit chain, and VIGIL health monitoring remain Beta/RC work pending opensecstack/sdk/rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Declared directly rather than via `.workspace = true`, same reasoning as
# capability-manager/Cargo.toml: this crate must stay `no_std` + `alloc` so
# it can eventually be called directly from `kernel/` (freestanding, no
# `std` at all) to gate module/driver loads at boot.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# force-soft: see capability-manager/Cargo.toml's comment — same LLVM ICE
# on x86_64-unknown-none with the default SIMD-selecting backend.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lib]
name = "runix_citadel_integration"
