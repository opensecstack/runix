# No `[build] target = ...` default here — same "don't leak an ambient
# target into a nested host-side invocation" reasoning as
# kernel/.cargo/config.toml and grid-sandbox-host/.cargo/config.toml, even
# though this crate has no nested invocation of its own today.

[target.x86_64-unknown-none]
# Without this, rustc's default for this target produces a position-
# independent (ET_DYN) executable — confirmed by actually inspecting the
# compiled binary's ELF header (`e_type = 3`, not `ET_EXEC = 2`), the same
# way grid-sandbox-host/.cargo/config.toml's own comment already documents
# for that crate. `kernel/src/elf.rs`'s loader treats every segment's
# `p_vaddr` as an absolute address with zero relocation processing, which
# only holds for a static, non-PIE binary — without this flag, a PIE
# binary's own function-pointer data (e.g. `format_args!`'s `Display::fmt`
# vtable entries, needed even for an `assert!`/`panic!` message that never
# actually fires) is never relocated, left as whatever raw placeholder the
# linker wrote for a dynamic loader that doesn't exist here. Confirmed as a
# real bug, not a theoretical one: without this flag, `net-driver-host`
# ring 3-faulted on an instruction fetch from address `0x0` almost
# immediately after entry — a null, never-relocated function pointer
# somewhere getting called.
rustflags = ["-C", "relocation-model=static"]
