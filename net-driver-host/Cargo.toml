[package]
name = "net-driver-host"
description = "Network driver host: a freestanding ring 3 binary running the legacy virtio-net driver — Beta's 'user-space network stack' roadmap item, Phase 1 (virtqueue proof, no TCP/IP yet). Loaded via kernel/src/elf.rs and scheduler::spawn_ring3_process_with_capability, capability-gated port I/O only, never linked into the kernel itself."
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

# NOT a member of the root workspace — same reasoning as grid-sandbox-host
# (see its own Cargo.toml comment): this targets `x86_64-unknown-none`, a
# different target than every host-side crate in the root workspace. Needs
# no nightly feature — see this crate's own rust-toolchain.toml.
[workspace]

[dependencies]
linked_list_allocator = "0.10"

[[bin]]
name = "net-driver-host"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
