[package]
name = "net-driver-host"
description = "Network driver host: a freestanding ring 3 binary running the legacy virtio-net driver plus smoltcp (ICMP + TCP client) — Beta's 'user-space network stack' roadmap item. Loaded via kernel/src/elf.rs and scheduler::spawn_ring3_process_with_capability, capability-gated port I/O only, never linked into the kernel itself."
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

# NOT a member of the root workspace — same reasoning as grid-sandbox-host
# (see its own Cargo.toml comment): this targets `x86_64-unknown-none`, a
# different target than every host-side crate in the root workspace. Needs
# no nightly feature — see this crate's own rust-toolchain.toml.
[workspace]

[dependencies]
linked_list_allocator = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-icmp", "socket-tcp", "socket-dhcpv4", "socket-dns", "dns-max-server-count-4", "alloc"] }
# `socket-dns` pulls in `proto-dns` itself (see smoltcp 0.14's own
# `Cargo.toml`: `socket-dns = ["socket", "proto-dns"]`) -- no separate
# feature needed, same as `socket-dhcpv4` already pulling in `proto-dhcpv4`.
# `dns-max-server-count-4` (default is 1 -- smoltcp's own `build.rs`):
# `run_dns_lookup` deliberately hands the DNS socket the same real address
# 4 times over (see that constant's own doc comment) so a slow-to-arrive
# real-internet reply gets multiple ~10-second retry windows instead of
# just one, without changing this file's "1 loop iteration = 1ms" timestamp
# convention every other phase already relies on.
# `default-features = false`: skips `runix-ipc`'s `std` feature (and
# transitively `serde_json`, a hard-`std` dependency) -- this crate targets
# `x86_64-unknown-none` with no `std` at all. Only the `sockets` module
# (typed wire format for the sockets IPC surface, `sockets.rs`) is usable
# under that configuration; see `runix-ipc/src/lib.rs`'s own doc comment.
runix-ipc = { path = "../ipc", default-features = false }

[dev-dependencies]
# Host-only (tests run on the host, never the x86_64-unknown-none target) —
# property-tests the pure parsing/validation logic in lib.rs. See that
# file's `#![cfg_attr(not(test), no_std)]` split, same convention
# capability-manager already uses for the same reason.
proptest = "1"

[lib]
name = "net_driver_host"
path = "src/lib.rs"

[[bin]]
name = "net-driver-host"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
