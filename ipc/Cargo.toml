[package]
name = "runix-ipc"
description = "Shared IPC message/wire types used across Runix user-space services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `default-features = false` + explicit `alloc` (not `.workspace = true`, same
# reasoning as `capability-manager/Cargo.toml`'s own comment): the `sockets`
# module must stay `no_std` + `alloc` so `net-driver-host` (a freestanding
# `x86_64-unknown-none` ring 3 binary with no `std` at all) can depend on
# this crate directly (`default-features = false`) for its typed wire
# format, instead of hand-rolling one. `Envelope` (this crate's other,
# pre-existing type) stays std-only, gated behind the `std` feature default
# consumers get automatically.
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", optional = true }
# `fs`'s wire format embeds a real `CapabilityToken` on every request
# (see that module's doc comment) rather than a hand-rolled parallel
# authorization payload — same no_std + alloc-only dependency shape this
# crate's own `sockets` module already requires, so a freestanding ring 3
# binary like `blk-driver-host` can depend on this with
# `default-features = false` and still get both modules.
runix-capability-manager = { path = "../capability-manager" }

[features]
default = ["std"]
# Pulls in `serde_json` (a hard std dependency) and `serde`'s own `std`
# feature -- needed for `Envelope`, not for `sockets` (see that module's doc
# comment). A consumer that only needs `sockets` (e.g. `net-driver-host`)
# depends on this crate with `default-features = false` and skips all of it.
std = ["serde/std", "dep:serde_json"]

[dev-dependencies]
# Property-tests `sockets`'s `decode` functions against arbitrary/truncated
# byte input — same rigor `net-driver-host`'s own `lib.rs` already applies
# to device-controlled bytes (see docs/THREAT_MODEL.md's testing-rigor
# commitment).
proptest = "1"

[lib]
name = "runix_ipc"
